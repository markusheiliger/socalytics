name: Verification

# This repository's test automation runner. The generic OpenSpec orchestrator calls this reusable
# workflow for every complete apply checkpoint, with a read-only token and no secrets. Each test
# suite is a visible step or job here; dedicated runner actions (for example dotnet-test) only
# execute one technology's tests.
#
# Contract with the orchestrator:
# - inputs: change, sha (checkpoint commit), baseline (commit before the operation started);
# - fail when verification fails; the job conclusions decide the outcome;
# - upload the artifact openspec-verification-<change> with verification.txt (feedback for the
#   next agent attempt, most important lines first) and optionally log.txt.
on:
  workflow_call:
    inputs:
      change:
        description: OpenSpec change name
        required: true
        type: string
      sha:
        description: Checkpoint commit to verify
        required: true
        type: string
      baseline:
        description: Commit before the operation started, for deciding what changed
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  platform-tests:
    name: Run platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare the results directory
        run: |
          echo "RESULTS=$RUNNER_TEMP/openspec-verification" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/openspec-verification"

      - name: Check out the trusted repository tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the checkpoint commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          path: checkpoint
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the checkpoint changes the platform
        id: scope
        working-directory: checkpoint
        env:
          SHA: ${{ inputs.sha }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          if [[ -n "$BASELINE" ]] && git cat-file -e "$BASELINE^{commit}" 2>/dev/null \
            && [[ -z "$(git diff --name-only "$BASELINE" "$SHA" -- src/platform/)" ]]; then
            echo "Skipped: the checkpoint does not change src/platform/." > "$RESULTS/verification.txt"
            echo "platform=false" >> "$GITHUB_OUTPUT"
          else
            echo "platform=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the repository toolchain
        if: ${{ steps.scope.outputs.platform == 'true' }}
        uses: ./.github/actions/setup-toolchain
        with:
          global-json-file: checkpoint/src/platform/global.json

      - name: Run the platform tests with Testcontainers
        if: ${{ steps.scope.outputs.platform == 'true' }}
        uses: ./.github/actions/dotnet-test
        with:
          working-directory: checkpoint
          project: src/platform/SocAlytics.Platform.slnx
          results: ${{ runner.temp }}/openspec-verification

      - name: Upload the verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openspec-verification-${{ inputs.change }}
          path: |
            ${{ runner.temp }}/openspec-verification/verification.txt
            ${{ runner.temp }}/openspec-verification/log.txt
          retention-days: 3
          if-no-files-found: ignore
