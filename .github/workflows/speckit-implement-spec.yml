name: Spec Kit implement spec

# The implementation chain of one spec: every run decides what comes next for the spec from the state on GitHub, runs
# it, and starts the next run, until the implementation is merged, waits for review, or needs a person. Started by the
# scheduler (Spec Kit orchestrate), by itself, by `/speckit resume|sync` comments, and when an amendment is merged.
# Runs are named "Spec Kit implement spec #<twin> · <spec title>". The job names number the flow of a run: "1 · Decide
# what comes next", then exactly one of the alternatives numbered "2 · …" (a phase, the convergence, a conflict
# resolution, or the merge), then "3 · Start the next run" (the other alternatives show as skipped).
#   decide:              "1 · Decide what comes next": validates the twin, decides what comes next, and reports stops
#                        (attempt limit, diagnosis)
#   phase:               "2 · <phase heading as written>": one phase of tasks.md in Spec Kit implement phase, whose
#                        tasks run one after another in Spec Kit implement task (consecutive `[P]` tasks in parallel);
#                        "2 · Phase" when skipped
#   converge-or-resolve: "2 · Convergence" or "2 · Conflict resolution" in Spec Kit implement task, which belong to no
#                        phase; "2 · Convergence or conflict resolution" when skipped
#   merge-archive:       "2 · Merge: archive the spec": moves the spec folder to specs/archive/<folder> on the
#                        implementation branch and rewrites the references to it (write token, never runs agent-written
#                        code)
#   merge-verify:        "2 · Merge: integrate and verify": merges the base branch and runs the full verification
#                        (read-only token)
#   merge-land:          "2 · Merge: merge and report": squash-merges the pull request, or asks for review (never runs
#                        agent-written code)
#   continue:            "3 · Start the next run": dispatches the next run of the chain
run-name: "Spec Kit implement spec #${{ inputs.twin }}${{ inputs.title && format(' · {0}', inputs.title) || '' }}"

on:
  workflow_dispatch:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      resume:
        description: Resume a stopped implementation with a new attempt count (true or false)
        required: false
        type: string
        default: "false"
      guidance:
        description: Guidance for the agent of what stopped (optional, with resume)
        required: false
        type: string
      title:
        description: The spec title, for the run name (optional; the implementation pull request title without "Implement:")
        required: false
        type: string

permissions: {}

# One chain per spec: GitHub keeps one pending run per group; a replaced pending run is harmless, because every run
# decides from the state on GitHub.
concurrency:
  group: speckit-implement-${{ inputs.twin }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  decide:
    name: 1 · Decide what comes next
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never runs agent-written code. contents: write lets a diagnosis it starts delete a superseded amendment branch.
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      action: ${{ steps.decide.outputs.action }}
      continue: ${{ steps.decide.outputs.continue }}
      folder: ${{ steps.decide.outputs.folder }}
      head: ${{ steps.decide.outputs.head }}
      phase: ${{ steps.decide.outputs.phase }}
      job_name: ${{ steps.decide.outputs.job_name }}
      base_branch: ${{ steps.decide.outputs.base_branch }}
      order: ${{ steps.decide.outputs.order }}
      attempt: ${{ steps.decide.outputs.attempt }}
      check_run: ${{ steps.decide.outputs.check_run }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decide what comes next
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_RESUME: ${{ inputs.resume }}
          SPECKIT_GUIDANCE: ${{ inputs.guidance }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node .github/scripts/speckit-spec.mjs decide
  # Named "2 · <phase heading>"; nested jobs show below it as "2 · <phase heading> / T013 / Implement T013".
  phase:
    name: ${{ needs.decide.outputs.action == 'phase' && format('2 · {0}', needs.decide.outputs.job_name) || '2 · Phase' }}
    needs: decide
    if: needs.decide.outputs.action == 'phase'
    uses: ./.github/workflows/speckit-implement-phase.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      phase: ${{ needs.decide.outputs.phase }}

  # The convergence or a conflict resolution, whose attempt decide already started.
  converge-or-resolve:
    name: ${{ (needs.decide.outputs.action == 'converge' || needs.decide.outputs.action == 'resolve') && format('2 · {0}', needs.decide.outputs.job_name) || '2 · Convergence or conflict resolution' }}
    needs: decide
    if: needs.decide.outputs.action == 'converge' || needs.decide.outputs.action == 'resolve'
    uses: ./.github/workflows/speckit-implement-task.yml
    permissions:
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      kind: ${{ needs.decide.outputs.action }}
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      order: ${{ needs.decide.outputs.order }}
      index: 0

  # Archives the implemented spec on the implementation branch right before the merge (write token, trusted tooling; it
  # never runs agent-written code): merges the base branch, moves specs/<folder> to specs/archive/<folder>, rewrites the
  # references, and pushes. The verification and the merge then work on that head, so the base branch never has broken
  # links. On conflicts with the base branch it changes nothing, and the conflict resolution runs first.
  merge-archive:
    name: "2 · Merge: archive the spec"
    needs: decide
    if: needs.decide.outputs.action == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    outputs:
      head: ${{ steps.archive.outputs.head }}
      check_run: ${{ steps.archive.outputs.check_run }}
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      # Full history, so the base branch can be merged locally.
      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ needs.decide.outputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Archive the spec
        id: archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
          SPECKIT_HEAD: ${{ needs.decide.outputs.head }}
          SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
          SPECKIT_CHECK_RUN: ${{ needs.decide.outputs.check_run }}
          SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
        run: node tooling/.github/scripts/speckit-task.mjs archive

  # Runs agent-written code (the full verification), so it holds a read-only token.
  merge-verify:
    name: "2 · Merge: integrate and verify"
    needs: [decide, merge-archive]
    if: needs.decide.outputs.action == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPECKIT_KIND: merge
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
      SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      # Full history, so the base branch can be merged locally. The head the archive job pushed (or left unchanged).
      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.merge-archive.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Optional, solution-owned extension point; loaded from the trusted tooling checkout, never from the workspace.
      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Merge the default branch
        id: integrate
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-task.mjs" integrate

      # Optional, solution-owned extension point; every check runs on the merged result.
      - name: Verify the merged result
        id: verify
        if: >-
          steps.integrate.outputs.verify == 'true' &&
          hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      # One more run after a failure, so a flaky test does not use up a merge attempt; the verdict uses the last run.
      - name: Verify the merged result again
        id: verify-again
        if: steps.verify.outcome == 'failure'
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      # An environment spec changes the actions above, which the workflows load from the default branch, so its own
      # versions have not run yet. Run them once on the merged result before the merge. This job is read-only and
      # already runs agent-written code, so loading the actions from the workspace grants nothing new.
      - name: Self-test the changed environment setup
        id: selftest-setup
        if: >-
          steps.integrate.outputs.environment == 'true' &&
          hashFiles('workspace/.github/actions/environment-setup/action.yml') != ''
        continue-on-error: true
        uses: ./workspace/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Self-test the changed environment verification
        id: selftest-verify
        if: >-
          steps.integrate.outputs.environment == 'true' &&
          steps.selftest-setup.outcome != 'failure' &&
          hashFiles('workspace/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./workspace/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/selftest.log

      - name: Record the verdict
        env:
          SPECKIT_VERIFY_CONFIGURED: ${{ hashFiles('tooling/.github/actions/environment-verify/action.yml') != '' }}
          SPECKIT_VERIFY_OUTCOME: ${{ steps.verify-again.outcome == 'skipped' && steps.verify.outcome || steps.verify-again.outcome }}
          SPECKIT_VERIFY_CHECKS: ${{ steps.verify-again.outcome == 'skipped' && steps.verify.outputs.checks || steps.verify-again.outputs.checks }}
          SPECKIT_VERIFY_UNCOVERED: ${{ steps.verify-again.outcome == 'skipped' && steps.verify.outputs.uncovered || steps.verify-again.outputs.uncovered }}
          SPECKIT_VERIFY_RETRIED: ${{ steps.verify-again.outcome != 'skipped' }}
          SPECKIT_SELFTEST_OUTCOME: >-
            ${{ steps.selftest-setup.outcome == 'failure' && 'failure' || steps.selftest-verify.outcome }}
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-task.mjs" verdict

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-merge-result
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  # Never checks out or runs workspace code; it only uses the GitHub API.
  merge-land:
    name: "2 · Merge: merge and report"
    needs: [decide, merge-archive, merge-verify]
    if: always() && needs.decide.outputs.action == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    env:
      SPECKIT_KIND: merge
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
      SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
      # The archive job moves the merge check run to the head it pushed.
      SPECKIT_CHECK_RUN: ${{ needs.merge-archive.outputs.check_run || needs.decide.outputs.check_run }}
      SPECKIT_WORK_RESULT: ${{ needs.merge-archive.result != 'success' && format('archive {0}', needs.merge-archive.result) || needs.merge-verify.result }}
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the verification result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-merge-result
          path: ${{ github.workspace }}/speckit-result

      - name: Merge and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_AUTO_MERGE: ${{ vars.SPECKIT_AUTO_MERGE || 'true' }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node .github/scripts/speckit-task.mjs merge-land

  # Starts the next run of the chain unless this run was cancelled; a stop (attempt limit, diagnosis, review) is decided
  # by the next run's decide job. A failed phase verification is reported here as a stop.
  continue:
    name: 3 · Start the next run
    needs: [decide, phase, converge-or-resolve, merge-archive, merge-verify, merge-land]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      # Commenting on the implementation pull request (the stop report) needs pull-requests: write.
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start the next run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
          SPECKIT_PHASE_CHECK: ${{ needs.phase.outputs.verified }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node .github/scripts/speckit-spec.mjs continue