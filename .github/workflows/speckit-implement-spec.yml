name: Spec Kit implement spec

# The implementation chain of one spec: every run decides the next segment of the spec from the state on GitHub, runs
# it, and starts the next run, until the implementation is merged, waits for review, or needs a person. Started by the
# scheduler (Spec Kit orchestrate), by itself, by `/speckit resume|sync` comments, and when an amendment is merged.
# Runs are named "Spec Kit implement spec #<twin> · <spec title>"; the jobs show the segment.
#   decide:            validates the twin, decides the segment, and reports stops (attempt limit, diagnosis)
#   phase:             one phase of tasks.md in Spec Kit implement phase, named "Spec Kit implement phase #<twin> ·
#                      <phase heading>": its stages run one at a time in Spec Kit implement task
#   step:              the convergence or a conflict resolution in Spec Kit implement task, named "Spec Kit implement
#                      task #<twin> · Convergence" or "· Conflict resolution"; spec-level steps that belong to no phase,
#                      shown as "Converge or resolve conflicts" when skipped
#   merge-verify:      merges the default branch and runs the full verification (read-only token)
#   merge-land:        squash-merges the pull request, or asks for review (never runs agent-written code)
#   continue:          starts the next run of the chain
run-name: "Spec Kit implement spec #${{ inputs.twin }}${{ inputs.title && format(' · {0}', inputs.title) || '' }}"

on:
  workflow_dispatch:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      resume:
        description: Resume a stopped implementation with a new attempt count (true or false)
        required: false
        type: string
        default: "false"
      guidance:
        description: Guidance for the agent of the resumed step (optional, with resume)
        required: false
        type: string
      title:
        description: The spec title, for the run name (optional; the implementation pull request title without "Implement:")
        required: false
        type: string

permissions: {}

# One chain per spec: GitHub keeps one pending run per group; a replaced pending run is harmless, because every run
# decides from the state on GitHub.
concurrency:
  group: speckit-implement-${{ inputs.twin }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  decide:
    name: Decide the next segment
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never runs agent-written code. contents: write lets a diagnosis it starts delete a superseded amendment branch.
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      action: ${{ steps.decide.outputs.action }}
      continue: ${{ steps.decide.outputs.continue }}
      folder: ${{ steps.decide.outputs.folder }}
      head: ${{ steps.decide.outputs.head }}
      phase: ${{ steps.decide.outputs.phase }}
      title: ${{ steps.decide.outputs.title }}
      step: ${{ steps.decide.outputs.step }}
      stages: ${{ steps.decide.outputs.stages }}
      attempt: ${{ steps.decide.outputs.attempt }}
      check_run: ${{ steps.decide.outputs.check_run }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decide the next segment
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_RESUME: ${{ inputs.resume }}
          SPECKIT_GUIDANCE: ${{ inputs.guidance }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node .github/scripts/speckit-spec.mjs decide
  # The phase job's name is the title the phase workflow runs under; a reusable workflow has no run of its own.
  phase:
    name: ${{ needs.decide.outputs.action == 'phase' && needs.decide.outputs.title || 'Spec Kit implement phase' }}
    needs: decide
    if: needs.decide.outputs.action == 'phase'
    uses: ./.github/workflows/speckit-implement-phase.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      phase: ${{ needs.decide.outputs.phase }}

  # The convergence or a conflict resolution: a single stage, whose attempt decide already started.
  step:
    name: ${{ needs.decide.outputs.action == 'step' && needs.decide.outputs.title || 'Converge or resolve conflicts' }}
    needs: decide
    if: needs.decide.outputs.action == 'step'
    uses: ./.github/workflows/speckit-implement-task.yml
    permissions:
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      step: ${{ needs.decide.outputs.step }}
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      stages: ${{ needs.decide.outputs.stages }}
      index: 0

  # Runs agent-written code (the full verification), so it holds a read-only token.
  merge-verify:
    name: "Merge: integrate and verify"
    needs: decide
    if: needs.decide.outputs.action == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPECKIT_STEP: merge
      SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
      SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      # Full history, so the default branch can be merged locally.
      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Optional, solution-owned extension point; loaded from the trusted tooling checkout, never from the workspace.
      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Merge the default branch
        id: integrate
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-step.mjs" integrate

      # Optional, solution-owned extension point; every check runs on the merged result.
      - name: Verify the merged result
        id: verify
        if: >-
          steps.integrate.outputs.verify == 'true' &&
          hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      # One more run after a failure, so a flaky test does not use up a merge attempt; the verdict uses the last run.
      - name: Verify the merged result again
        id: verify-again
        if: steps.verify.outcome == 'failure'
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      # An environment spec changes the actions above, which the workflows load from the default branch, so its own
      # versions have not run yet. Run them once on the merged result before the merge. This job is read-only and
      # already runs agent-written code, so loading the actions from the workspace grants nothing new.
      - name: Self-test the changed environment setup
        id: selftest-setup
        if: >-
          steps.integrate.outputs.environment == 'true' &&
          hashFiles('workspace/.github/actions/environment-setup/action.yml') != ''
        continue-on-error: true
        uses: ./workspace/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Self-test the changed environment verification
        id: selftest-verify
        if: >-
          steps.integrate.outputs.environment == 'true' &&
          steps.selftest-setup.outcome != 'failure' &&
          hashFiles('workspace/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./workspace/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/selftest.log

      - name: Record the verdict
        env:
          SPECKIT_VERIFY_CONFIGURED: ${{ hashFiles('tooling/.github/actions/environment-verify/action.yml') != '' }}
          SPECKIT_VERIFY_OUTCOME: ${{ steps.verify-again.outcome == 'skipped' && steps.verify.outcome || steps.verify-again.outcome }}
          SPECKIT_VERIFY_CHECKS: ${{ steps.verify-again.outcome == 'skipped' && steps.verify.outputs.checks || steps.verify-again.outputs.checks }}
          SPECKIT_VERIFY_UNCOVERED: ${{ steps.verify-again.outcome == 'skipped' && steps.verify.outputs.uncovered || steps.verify-again.outputs.uncovered }}
          SPECKIT_VERIFY_RETRIED: ${{ steps.verify-again.outcome != 'skipped' }}
          SPECKIT_SELFTEST_OUTCOME: >-
            ${{ steps.selftest-setup.outcome == 'failure' && 'failure' || steps.selftest-verify.outcome }}
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-step.mjs" verdict

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-merge-result
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  # Never checks out or runs workspace code; it only uses the GitHub API.
  merge-land:
    name: "Merge: merge and report"
    needs: [decide, merge-verify]
    if: always() && needs.decide.outputs.action == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    env:
      SPECKIT_STEP: merge
      SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
      SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
      SPECKIT_CHECK_RUN: ${{ needs.decide.outputs.check_run }}
      SPECKIT_WORK_RESULT: ${{ needs.merge-verify.result }}
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the verification result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-merge-result
          path: ${{ github.workspace }}/speckit-result

      - name: Merge and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_AUTO_MERGE: ${{ vars.SPECKIT_AUTO_MERGE || 'true' }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node .github/scripts/speckit-step.mjs merge-land

  # Starts the next run of the chain unless this run was cancelled; a stop (attempt limit, diagnosis, review) is decided
  # by the next run's decide job. A failed phase verification is reported here as a stop.
  continue:
    name: Continue the implementation
    needs: [decide, phase, step, merge-verify, merge-land]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start the next run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
          SPECKIT_PHASE_CHECK: ${{ needs.phase.outputs.verified }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node .github/scripts/speckit-spec.mjs continue