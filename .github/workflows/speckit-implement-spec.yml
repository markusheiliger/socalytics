name: Spec Kit implement spec

# The implementation chain of one spec: every run decides what comes next for the spec from the state on GitHub, runs
# it, and starts the next run, until the implementation is merged, waits for review, or needs a person. Started by the
# scheduler (Spec Kit orchestrate), by itself, by `/speckit retry` comments, when an amendment is merged, and when a
# fix spec has landed. A retry restarts on the branch as it is and preserves the current phase base.
# Runs are named "Spec Kit implement spec #<twin> · <spec title>". Every run first brings the base branch in when the
# next work needs it ("Merge the base branch"), decides what comes next ("Decide what comes next"), runs exactly one
# alternative (a phase, a repair, the convergence, a conflict resolution, or the merge; the others show as skipped), and then
# starts the next run ("Start the next run"). Job names say what the job does; GitHub shows the order of the jobs.
#   sync:                "Merge the base branch": pull model. When the next work is a phase that has not started (none
#                        of its tasks ticked), the convergence, or the merge, it
#                        merges the base branch into the implementation branch through the GitHub API (repository
#                        variable SPECKIT_SYNC_BASE, default true). A conflict is recorded on the head, and the decide
#                        job starts the conflict resolution with Copilot CLI in the same run: best effort before a phase
#                        or the convergence (the work continues on the current base when it fails), required before the
#                        merge (write token, never runs agent-written code)
#                        A durable /speckit sync request instead selects the resolve workflow below, irrespective of
#                        SPECKIT_SYNC_BASE: even clean and already-current merges must pass isolated verification.
#   decide:              "Decide what comes next": validates the twin, decides what comes next, and reports stops
#                        (attempt limit, diagnosis)
#   phase:               "<phase heading as written>": one phase of tasks.md in Spec Kit implement phase, whose tasks
#                        run one after another in Spec Kit implement task (consecutive `[P]` tasks in parallel);
#                        "Implement a phase" when skipped
#   converge:            "Convergence" in Spec Kit implement convergence, which belongs to no phase
#   resolve:             "Conflict resolution" in Spec Kit implement conflict resolution, which belongs to no phase
#   merge:               "Merge implementation" in Spec Kit implement merge: archives the spec, verifies the
#                        prospective merged tree, then squash-merges the pull request or asks for review
#   continue:            "Start the next run": dispatches the next run of the chain
run-name: "Spec Kit implement spec #${{ inputs.twin }}${{ inputs.title && format(' · {0}', inputs.title) || '' }}"

on:
  workflow_dispatch:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      guidance:
        description: Guidance for the agent of what stopped (optional)
        required: false
        type: string
      title:
        description: The spec title, for the run name (optional; the implementation pull request title without "Implement:")
        required: false
        type: string

permissions: {}

# One chain per spec: GitHub keeps one pending run per group; a replaced pending run is harmless, because every run
# decides from the state on GitHub.
concurrency:
  group: speckit-implement-${{ inputs.twin }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  # Pull model: first in every run, it merges the base branch into the implementation branch when the next work is a
  # phase that has not started (none of its tasks ticked), the convergence, or the merge (write token, never runs
  # agent-written code). The merge goes through the GitHub API; a conflict is
  # recorded on the head, so the decide job starts the conflict resolution with Copilot CLI in this same run.
  sync:
    name: Merge the base branch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: speckit-publication-${{ inputs.pull }}
      queue: max
      cancel-in-progress: false
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Merge the base branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_SYNC_BASE: ${{ vars.SPECKIT_SYNC_BASE || 'true' }}
        run: node .github/scripts/speckit-spec.mjs sync

  decide:
    name: Decide what comes next
    needs: sync
    # Decides even when the merge of the base branch failed; the work then continues on the current base.
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never runs agent-written code. contents: write lets a diagnosis it starts delete a superseded amendment branch.
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      action: ${{ steps.decide.outputs.action }}
      continue: ${{ steps.decide.outputs.continue }}
      folder: ${{ steps.decide.outputs.folder }}
      head: ${{ steps.decide.outputs.head }}
      phase: ${{ steps.decide.outputs.phase }}
      job_name: ${{ steps.decide.outputs.job_name }}
      base_branch: ${{ steps.decide.outputs.base_branch }}
      order: ${{ steps.decide.outputs.order }}
      attempt: ${{ steps.decide.outputs.attempt }}
      check_run: ${{ steps.decide.outputs.check_run }}
      repair: ${{ steps.decide.outputs.repair }}
      prompt: ${{ steps.decide.outputs.prompt }}
      verify_only: ${{ steps.decide.outputs.verify_only }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decide what comes next
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_GUIDANCE: ${{ inputs.guidance }}
        run: node .github/scripts/speckit-spec.mjs decide

  # Named after the phase heading; nested jobs show below it as "<phase heading> / T013 / Implement T013".
  phase:
    name: ${{ needs.decide.outputs.action == 'implement' && needs.decide.outputs.job_name || 'Implement a phase' }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'implement' }}
    uses: ./.github/workflows/speckit-implement-phase.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      phase: ${{ needs.decide.outputs.phase }}

  repair:
    name: ${{ needs.decide.outputs.action == 'repair' && needs.decide.outputs.job_name || 'Repair verification failure' }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'repair' }}
    uses: ./.github/workflows/speckit-implement-repair.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      repair: ${{ needs.decide.outputs.repair }}
      head: ${{ needs.decide.outputs.head }}
      prompt: ${{ needs.decide.outputs.prompt }}
      verify_only: ${{ needs.decide.outputs.verify_only == 'true' }}
      attempt: ${{ fromJSON(needs.decide.outputs.attempt) }}
      check_run: ${{ fromJSON(needs.decide.outputs.check_run) }}
  # The convergence attempt that decide already started.
  converge:
    name: ${{ needs.decide.outputs.action == 'converge' && needs.decide.outputs.job_name || 'Convergence' }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'converge' }}
    uses: ./.github/workflows/speckit-implement-converge.yml
    permissions:
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      order: ${{ needs.decide.outputs.order }}

  # The conflict-resolution attempt that decide already started.
  resolve:
    name: ${{ needs.decide.outputs.action == 'resolve' && needs.decide.outputs.job_name || 'Conflict resolution' }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'resolve' }}
    uses: ./.github/workflows/speckit-implement-resolve.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      order: ${{ needs.decide.outputs.order }}

  # The complete merge alternative: archive the spec, verify the prospective merged tree, then merge or request review.
  merge:
    name: Merge implementation
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'merge' }}
    uses: ./.github/workflows/speckit-implement-merge.yml
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      head: ${{ needs.decide.outputs.head }}
      attempt: ${{ needs.decide.outputs.attempt }}
      check_run: ${{ needs.decide.outputs.check_run }}

  # Starts the next run of the chain unless this run was cancelled; a stop (attempt limit, diagnosis, review) is decided
  # by the next run's decide job. A failed phase verification is reported here as a stop.
  continue:
    name: Start the next run
    needs: [sync, decide, phase, repair, converge, resolve, merge]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      # Commenting on the implementation pull request (the stop report) needs pull-requests: write.
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start the next run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
          SPECKIT_PHASE_CHECK: ${{ needs.phase.outputs.verified }}
          SPECKIT_PHASE: ${{ needs.phase.outputs.phase }}
          SPECKIT_ORDER: ${{ needs.phase.outputs.order }}
          SPECKIT_VERIFY_FLAKY: ${{ needs.phase.outputs.flaky }}
        run: node .github/scripts/speckit-spec.mjs continue