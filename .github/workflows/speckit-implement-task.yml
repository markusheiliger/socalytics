name: Spec Kit implement task

# Exactly one task, never started on its own: called by Spec Kit implement group. The work job runs agent-written code
# with a read-only token; the land job validates, ticks, commits, pushes, and reports that one task without executing
# agent-written code. A task in a multi-task group defers the transition to the next unit until the group verification.
on:
  workflow_call:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      folder:
        description: Spec folder name under specs/
        required: true
        type: string
      base:
        description: Base branch of the implementation pull request
        required: true
        type: string
      order:
        description: Ordered phase units as JSON, used only to identify the next unit
        required: true
        type: string
      index:
        description: Index of this task's unit in the phase order
        required: true
        type: number
      task:
        description: Task ID
        required: true
        type: string
      attempt:
        description: Task attempt number
        required: true
        type: number
      prompt:
        description: Prompt for the task agent
        required: true
        type: string
      verify_mode:
        description: Verification mode for the task
        required: false
        type: string
        default: task
      summary:
        description: Short task summary
        required: false
        type: string
        default: ""
      defer_progress:
        description: Whether a multi-task group reports the transition to the next unit
        required: false
        type: boolean
        default: false
    outputs:
      ok:
        description: Whether the task landed
        value: ${{ jobs.land.outputs.ok }}
      head:
        description: Head after the task landed
        value: ${{ jobs.land.outputs.head }}

permissions: {}

jobs:
  work:
    name: Implement ${{ inputs.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      copilot-requests: write
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_TASK: ${{ inputs.task }}
      SPECKIT_ATTEMPT: ${{ inputs.attempt }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Record the start commit
        run: echo "SPECKIT_HEAD=$(git -C workspace rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python for the Spec Kit scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Locate the spec folder
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          if [ -d "workspace/specs/$FOLDER" ]; then dir="specs/$FOLDER"; else dir="specs/archive/$FOLDER"; fi
          echo "SPECIFY_FEATURE_DIRECTORY=$dir" >> "$GITHUB_ENV"

      - name: Run Copilot CLI
        uses: ./tooling/.github/actions/speckit-copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          level: standard
          mode: agent
          prompt: ${{ inputs.prompt }}
          ai-credits: ${{ vars.SPECKIT_TASK_AI_CREDITS || '1000' }}
          working-directory: workspace
          output-format: json
          output-file: ${{ env.SPECKIT_RESULT_DIR }}/agent.jsonl
          exit-code-file: ${{ env.SPECKIT_RESULT_DIR }}/agent-exit.txt

      - name: Package the result
        id: package
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-task.mjs" package

      - name: Verify the change
        id: verify
        if: >-
          steps.package.outputs.verify == 'true' &&
          hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: ${{ inputs.verify_mode }}
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Record the verdict
        env:
          SPECKIT_VERIFY_CONFIGURED: ${{ hashFiles('tooling/.github/actions/environment-verify/action.yml') != '' }}
          SPECKIT_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SPECKIT_VERIFY_CHECKS: ${{ steps.verify.outputs.checks }}
          SPECKIT_VERIFY_UNCOVERED: ${{ steps.verify.outputs.uncovered }}
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-task.mjs" verdict

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-result-${{ inputs.task }}
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  land:
    name: Commit and push ${{ inputs.task }}
    concurrency:
      group: speckit-publication-${{ inputs.pull }}
      queue: max
      cancel-in-progress: false
    needs: work
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    outputs:
      ok: ${{ steps.land.outputs.ok }}
      head: ${{ steps.land.outputs.head }}
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_ORDER: ${{ inputs.order }}
      SPECKIT_ORDER_INDEX: ${{ inputs.index }}
      SPECKIT_TASK: ${{ inputs.task }}
      SPECKIT_DEFER_PROGRESS: ${{ inputs.defer_progress }}
      SPECKIT_WORK_RESULT: ${{ needs.work.result }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_ROOT: ${{ github.workspace }}/results
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the task result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-result-${{ inputs.task }}
          path: ${{ github.workspace }}/results

      - name: Commit, push, and report the task
        id: land
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node tooling/.github/scripts/speckit-task.mjs land-tasks
