name: OpenSpec Changeset Validation

on:
  pull_request:
    paths:
      - .github/scripts/openspec-changeset-*.mjs
      - .github/skills/soca-changeset/**
      - .github/workflows/openspec-changeset*.yml
      - AGENTS.md
      - README.md
  push:
    branches: [main]
    paths:
      - .github/scripts/openspec-changeset-*.mjs
      - .github/skills/soca-changeset/**
      - .github/workflows/openspec-changeset*.yml
      - AGENTS.md
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in .github/scripts/openspec-changeset-*.mjs; do
            node --check "$script"
          done

      - name: Run changeset tests
        run: node --test .github/scripts/openspec-changeset-core.test.mjs .github/scripts/openspec-changeset-controller.test.mjs .github/scripts/openspec-changeset-github.test.mjs