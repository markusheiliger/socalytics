name: Spec Kit resolve

# Resolves merge conflicts between the default branch and a speckit/<folder> branch with Copilot CLI after the
# merge jobs of Spec Kit orchestrate found them. The agent edits only the conflicted files; the full verification
# runs on the result; the land job replays the merge itself, takes only the agent's versions of the conflicted
# files, and pushes the merge commit. Started by the Spec Kit orchestrate workflow; the hand-back job starts the
# orchestrator again when the run ends.
#   begin:     checks that a conflict is recorded for the current head and marks the attempt as in progress
#   work:      merges the default branch, runs the agent and the full verification with a read-only token
#   land:      re-validates, commits the merge, pushes, and reports; it never runs agent-written code
#   hand-back: dispatches the orchestrator with this run id, whatever the outcome
run-name: "Spec Kit resolve #${{ inputs.twin }} attempt ${{ inputs.attempt }}"

on:
  workflow_dispatch:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      attempt:
        description: Attempt number
        required: true
        type: string

permissions: {}

concurrency:
  group: speckit-twin-${{ inputs.twin }}
  cancel-in-progress: false

env:
  SPECKIT_STEP: resolve
  SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
  SPECKIT_TWIN: ${{ inputs.twin }}
  SPECKIT_PULL: ${{ inputs.pull }}
  SPECKIT_ATTEMPT: ${{ inputs.attempt }}

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  begin:
    name: Check the state and mark the attempt
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: write
    outputs:
      proceed: ${{ steps.begin.outputs.proceed }}
      folder: ${{ steps.begin.outputs.folder }}
      head: ${{ steps.begin.outputs.head }}
      check_run: ${{ steps.begin.outputs.check_run }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the inputs and mark the attempt
        id: begin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/speckit-step.mjs begin

  work:
    name: Resolve and verify
    needs: begin
    if: needs.begin.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      copilot-requests: write
    env:
      SPECKIT_FOLDER: ${{ needs.begin.outputs.folder }}
      SPECKIT_HEAD: ${{ needs.begin.outputs.head }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      # Full history, so the default branch can be merged locally.
      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.begin.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      # Optional, solution-owned extension point; loaded from the trusted tooling checkout, never from the workspace.
      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Merge the default branch
        id: integrate
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-step.mjs" integrate

      # The token reaches Copilot CLI only as COPILOT_GITHUB_TOKEN, which --secret-env-vars strips from the
      # agent's shells. The job token is read-only, so even a leaked token cannot push.
      - name: Resolve the conflicts with Copilot CLI
        if: steps.integrate.outputs.agent == 'true'
        working-directory: workspace
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          PROMPT: ${{ steps.integrate.outputs.prompt }}
          AI_CREDITS: ${{ vars.SPECKIT_TASK_AI_CREDITS || '1000' }}
        run: |
          set +e
          timeout --kill-after=60s 60m copilot -p "$PROMPT" \
            --no-ask-user --no-auto-update --allow-all-tools --disable-builtin-mcps \
            --deny-tool 'shell(git push:*)' --deny-tool 'shell(git commit:*)' --deny-tool 'shell(git merge:*)' \
            --deny-tool 'shell(git checkout:*)' --deny-tool 'shell(git reset:*)' --deny-tool 'shell(git restore:*)' \
            --deny-tool 'shell(git stash:*)' --deny-tool 'shell(git rebase:*)' --deny-tool 'shell(gh:*)' \
            --deny-tool 'shell(curl:*)' --deny-tool 'shell(wget:*)' \
            --secret-env-vars=COPILOT_GITHUB_TOKEN --max-ai-credits "$AI_CREDITS" \
            --output-format json > "$SPECKIT_RESULT_DIR/agent.jsonl"
          echo "$?" > "$SPECKIT_RESULT_DIR/agent-exit.txt"

      - name: Package the resolution
        id: package
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-step.mjs" package

      # Optional, solution-owned extension point; loaded from the trusted tooling checkout. The job env holds no
      # tokens, so the agent-written code it runs cannot reach one.
      - name: Verify the merged result
        id: verify
        if: >-
          steps.package.outputs.verify == 'true' &&
          hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Record the verdict
        env:
          SPECKIT_VERIFY_CONFIGURED: ${{ hashFiles('tooling/.github/actions/environment-verify/action.yml') != '' }}
          SPECKIT_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SPECKIT_VERIFY_CHECKS: ${{ steps.verify.outputs.checks }}
          SPECKIT_VERIFY_UNCOVERED: ${{ steps.verify.outputs.uncovered }}
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-step.mjs" verdict

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-step-result
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  land:
    name: Land the merge and report
    needs: [begin, work]
    if: always() && needs.begin.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: write
    env:
      SPECKIT_FOLDER: ${{ needs.begin.outputs.folder }}
      SPECKIT_CHECK_RUN: ${{ needs.begin.outputs.check_run }}
      SPECKIT_WORK_RESULT: ${{ needs.work.result }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.begin.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the work result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-step-result
          path: ${{ github.workspace }}/speckit-result

      - name: Land the merge and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node tooling/.github/scripts/speckit-step.mjs land

  # GitHub raises no workflow_run event for these runs, so the hand-back is an explicit dispatch.
  hand-back:
    name: Hand back to the orchestrator
    needs: [begin, work, land]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Spec Kit orchestrate workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          gh workflow run speckit-orchestrate.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          -f after_run="$GITHUB_RUN_ID"
