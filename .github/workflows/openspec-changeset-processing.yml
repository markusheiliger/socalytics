name: OpenSpec Changeset Processing

on:
  issues:
    types: [edited, labeled, reopened]
  pull_request_target:
    types: [opened, edited, reopened, closed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Changeset issue number; blank processes all active changesets
        required: false
        type: string
      command:
        description: Controller operation
        required: true
        default: reconcile
        type: choice
        options:
          - reconcile
          - retry
          - accept-graph
          - dry-run

permissions:
  contents: read

jobs:
  discover:
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issues: ${{ steps.discover.outputs.issues }}
      command: ${{ steps.discover.outputs.command }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Discover affected changesets
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
          REQUESTED_COMMAND: ${{ inputs.command }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command="${REQUESTED_COMMAND:-reconcile}"
          case "$EVENT_NAME" in
            issues)
              issues=$(jq -c '
                [.issue.labels[].name] as $labels
                | if ($labels | any(. == "openspec:changeset"))
                  and ($labels | any(. == "changeset:ready" or . == "changeset:running" or . == "changeset:attention"))
                  then [.issue.number] else [] end
              ' "$GITHUB_EVENT_PATH")
              ;;
            pull_request_target)
              issues=$(node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
                const match = event.pull_request.body?.match(/<!--\s*openspec-changeset-pr:v1\s+({[\s\S]*?})\s*-->/);
                let issue;
                try { issue = match ? JSON.parse(match[1]).changeset : undefined; } catch {}
                process.stdout.write(JSON.stringify(Number.isInteger(issue) && issue > 0 ? [issue] : []));
              ')
              ;;
            workflow_dispatch)
              if [[ -n "${REQUESTED_ISSUE:-}" ]]; then
                [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "Issue must be a positive integer" >&2; exit 1; }
                issues="[$REQUESTED_ISSUE]"
              else
                issues=$(node .github/scripts/openspec-changeset-controller.mjs list)
              fi
              ;;
            schedule)
              issues=$(node .github/scripts/openspec-changeset-controller.mjs list)
              ;;
            *)
              issues='[]'
              ;;
          esac
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: discover
    if: needs.discover.outputs.issues != '[]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.discover.outputs.issues) }}
    concurrency:
      group: openspec-changeset-${{ matrix.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile changeset
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/openspec-changeset-controller.mjs "${{ needs.discover.outputs.command }}" --issue "${{ matrix.issue }}"