name: OpenSpec Changeset Processing

on:
  issues:
    types: [opened, edited, labeled, reopened, closed]
  pull_request_target:
    types: [opened, edited, reopened, closed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Changeset issue number; blank processes all active changesets
        required: false
        type: string
      change:
        description: OpenSpec change ref; required only with recover
        required: false
        type: string
      command:
        description: Controller operation
        required: true
        default: reconcile
        type: choice
        options:
          - reconcile
          - retry
          - recover
          - accept-graph
          - dry-run

permissions:
  contents: read

jobs:
  discover:
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issues: ${{ steps.discover.outputs.issues }}
      command: ${{ steps.discover.outputs.command }}
      change: ${{ steps.discover.outputs.change }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Discover affected changesets
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ISSUE: ${{ inputs.issue }}
          REQUESTED_CHANGE: ${{ inputs.change }}
          REQUESTED_COMMAND: ${{ inputs.command }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command="${REQUESTED_COMMAND:-reconcile}"
          change="${REQUESTED_CHANGE:-}"
          if [[ "$command" == "recover" && -z "${REQUESTED_ISSUE:-}" ]]; then
            echo "Recover requires one parent changeset issue" >&2
            exit 1
          fi
          if [[ "$command" == "recover" && -z "$change" ]]; then
            echo "Recover requires one OpenSpec change ref" >&2
            exit 1
          fi
          if [[ -n "$change" ]]; then
            [[ "$command" == "recover" ]] || { echo "Change may be supplied only with recover" >&2; exit 1; }
            [[ "$change" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "Change must be a kebab-case OpenSpec ref" >&2; exit 1; }
          fi
          case "$EVENT_NAME" in
            issues)
              issues=$(node --input-type=module -e '
                import { readFileSync } from "node:fs";
                import { parseBlockerIssue } from "./.github/scripts/openspec-changeset-controller.mjs";
                const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
                const labels = new Set(event.issue.labels.map((label) => label.name));
                let issue;
                if (labels.has("openspec:changeset")
                  && ["changeset:ready", "changeset:running", "changeset:attention"].some((label) => labels.has(label))) {
                  issue = event.issue.number;
                } else if (labels.has("openspec:change-blocker")) {
                  issue = parseBlockerIssue(event.issue)?.parentIssue;
                }
                process.stdout.write(JSON.stringify(Number.isInteger(issue) && issue > 0 ? [issue] : []));
              ')
              ;;
            pull_request_target)
              issues=$(node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
                const match = event.pull_request.body?.match(/<!--\s*openspec-changeset-pr:v1\s+({[\s\S]*?})\s*-->/);
                let issue;
                try { issue = match ? JSON.parse(match[1]).changeset : undefined; } catch {}
                process.stdout.write(JSON.stringify(Number.isInteger(issue) && issue > 0 ? [issue] : []));
              ')
              ;;
            workflow_dispatch)
              if [[ -n "${REQUESTED_ISSUE:-}" ]]; then
                [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "Issue must be a positive integer" >&2; exit 1; }
                issues="[$REQUESTED_ISSUE]"
              else
                issues=$(node .github/scripts/openspec-changeset-controller.mjs list)
              fi
              ;;
            schedule)
              issues=$(node .github/scripts/openspec-changeset-controller.mjs list)
              ;;
            *)
              issues='[]'
              ;;
          esac
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
          echo "change=$change" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: discover
    if: needs.discover.outputs.issues != '[]'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.discover.outputs.issues) }}
    concurrency:
      group: openspec-changeset-${{ matrix.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Reconcile changeset
        env:
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=("${{ needs.discover.outputs.command }}" --issue "${{ matrix.issue }}")
          if [[ -n "${{ needs.discover.outputs.change }}" ]]; then
            args+=(--change "${{ needs.discover.outputs.change }}")
          fi
          node .github/scripts/openspec-changeset-controller.mjs "${args[@]}"