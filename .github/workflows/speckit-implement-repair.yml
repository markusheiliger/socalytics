name: Spec Kit implement repair

# A writer-approved repair of already-landed code after a verification failure. The work job receives the diagnosis
# guidance and cannot push. The land job validates and pushes without executing agent-written code. The verify job
# reruns the failed scope, and only the report job may resolve the durable repair marker.
on:
  workflow_call:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      folder:
        description: Spec folder name
        required: true
        type: string
      base:
        description: Pull request base branch
        required: true
        type: string
      head:
        description: Implementation head selected by the decision
        required: true
        type: string
      repair:
        description: Validated pending repair state as JSON
        required: true
        type: string
      prompt:
        description: Writer-approved repair prompt
        required: true
        type: string
      verify_only:
        description: Reverify the unchanged branch without running a repair agent
        required: false
        type: boolean
        default: false
      attempt:
        description: Repair attempt number
        required: true
        type: number
      check_run:
        description: In-progress repair check run
        required: true
        type: number

permissions: {}

jobs:
  work:
    name: Repair the implementation
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      copilot-requests: write
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ inputs.attempt }}
      SPECKIT_REPAIR_SCOPE: ${{ fromJSON(inputs.repair).scope }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Record the start commit
        run: echo "SPECKIT_HEAD=$(git -C workspace rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python for the Spec Kit scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reserve ignored evidence inside the agent workspace
        working-directory: workspace
        run: |
          test -z "$(git ls-files -- .speckit-repair-evidence)"
          echo '/.speckit-repair-evidence/' >> .git/info/exclude

      - name: Download the failed verification evidence
        if: ${{ fromJSON(inputs.repair).run != '' && fromJSON(inputs.repair).artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(inputs.repair).artifact }}
          run-id: ${{ fromJSON(inputs.repair).run }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/workspace/.speckit-repair-evidence

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Locate the spec folder
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          if [ -d "workspace/specs/$FOLDER" ]; then dir="specs/$FOLDER"; else dir="specs/archive/$FOLDER"; fi
          echo "SPECIFY_FEATURE_DIRECTORY=$dir" >> "$GITHUB_ENV"

      - name: Run Copilot CLI
        uses: ./tooling/.github/actions/speckit-copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          level: strong
          mode: agent
          prompt: ${{ inputs.prompt }}
          ai-credits: ${{ vars.SPECKIT_REPAIR_AI_CREDITS || '1000' }}
          working-directory: workspace
          output-format: json
          output-file: ${{ env.SPECKIT_RESULT_DIR }}/agent.jsonl
          exit-code-file: ${{ env.SPECKIT_RESULT_DIR }}/agent-exit.txt

      - name: Package the repair
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-repair.mjs" package

      - name: Upload the repair
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-result-repair
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  land:
    name: Commit and push the repair
    needs: work
    if: ${{ !inputs.verify_only && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    outputs:
      head: ${{ steps.land.outputs.head }}
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_ORDER: '[{"include":[{"task":null,"attempt":${{ inputs.attempt }}}]}]'
      SPECKIT_ORDER_INDEX: "0"
      SPECKIT_WORK_RESULT: ${{ needs.work.result }}
      SPECKIT_REPAIR_SCOPE: ${{ fromJSON(inputs.repair).scope }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_ROOT: ${{ github.workspace }}/results
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the repair
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-result-repair
          path: ${{ github.workspace }}/results

      - name: Validate, commit, and push the repair
        id: land
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/.github/scripts/speckit-repair.mjs land-tasks

  verify:
    name: Verify the repair
    needs: [work, land]
    if: ${{ !cancelled() && (inputs.verify_only || needs.land.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      head: ${{ steps.head.outputs.head }}
      verification: ${{ steps.verification.outcome }}
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the landed repair
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.verify_only && inputs.head || needs.land.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the original verification scope
        if: ${{ fromJSON(inputs.repair).run != '' && fromJSON(inputs.repair).artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(inputs.repair).artifact }}
          run-id: ${{ fromJSON(inputs.repair).run }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/failed-verification

      - name: Record the verified head
        id: head
        working-directory: workspace
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the verification action
        run: test -f tooling/.github/actions/environment-verify/action.yml

      - name: Prepare the verification tree
        id: tree
        working-directory: workspace
        env:
          BASE_BRANCH: ${{ inputs.base }}
          FAILED_HEAD: ${{ fromJSON(inputs.repair).head }}
          SCOPE: ${{ fromJSON(inputs.repair).scope }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          if [ "$SCOPE" = "merge" ]; then
            git fetch --quiet origin "$BASE_BRANCH"
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com merge --no-ff --no-commit "origin/$BASE_BRANCH"
            git diff --name-only --no-renames "origin/$BASE_BRANCH"...HEAD > "$SPECKIT_RESULT_DIR/repair-changed-files.txt"
          else
            start="$FAILED_HEAD"
            if ! git merge-base --is-ancestor "$start" HEAD; then start="$(git merge-base "$start" HEAD || true)"; fi
            if ! git diff --name-only --no-renames "$start" HEAD > "$SPECKIT_RESULT_DIR/repair-changed-files.txt"; then
              rm -f "$SPECKIT_RESULT_DIR/repair-changed-files.txt"
            fi
          fi
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { repairVerificationScope } from '../tooling/.github/scripts/speckit-repair.mjs';
          const read = (file) => existsSync(file) ? readFileSync(file, 'utf8') : null;
          const dir = process.env.SPECKIT_RESULT_DIR;
          const result = repairVerificationScope({
            scope: process.env.SCOPE,
            originalChangedFiles: read('../failed-verification/changed-files.txt'),
            repairChangedFiles: read(`${dir}/repair-changed-files.txt`),
          });
          writeFileSync(`${dir}/changed-files.txt`, result.changedFiles.map((file) => `${file}\n`).join(''));
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${result.mode}\nenvironment=${result.environment}\n`);
          console.log(`Repair verification mode: ${result.mode}; ${result.changedFiles.length} changed paths (original scope plus repair).`);
          NODE

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Verify the repaired scope
        id: verification
        if: hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: ${{ steps.tree.outputs.mode }}
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Self-test the repaired environment setup
        if: >-
          steps.tree.outputs.environment == 'true' &&
          hashFiles('workspace/.github/actions/environment-setup/action.yml') != ''
        uses: ./workspace/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Self-test the repaired environment verification
        if: >-
          steps.tree.outputs.environment == 'true' &&
          hashFiles('workspace/.github/actions/environment-verify/action.yml') != ''
        uses: ./workspace/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/environment-self-test.log

      - name: Upload the repair verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-repair-verification
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Report the repair
    needs: [land, verify]
    if: ${{ always() && (inputs.verify_only || needs.land.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Report the repair verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_ATTEMPT: ${{ inputs.attempt }}
          SPECKIT_CHECK_RUN: ${{ inputs.check_run }}
          SPECKIT_REPAIR: ${{ inputs.repair }}
          SPECKIT_HEAD: ${{ needs.verify.outputs.head || needs.land.outputs.head }}
          SPECKIT_VERIFY_RESULT: ${{ needs.verify.result }}
          SPECKIT_VERIFICATION_OUTCOME: ${{ needs.verify.outputs.verification }}
        run: node .github/scripts/speckit-repair.mjs repair-report
