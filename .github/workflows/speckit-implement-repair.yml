name: Spec Kit implement repair

# A writer-approved repair of landed code after a verification failure (see Spec Kit implement decide): prepare the run,
# repair the implementation (one call of Spec Kit implement task, named after the failed verification), reverify the
# original failed scope together with the repair in shards side by side, report it, and start the next run. Without
# guidance only the reverification runs.
run-name: >-
  Spec Kit implement spec #${{ inputs.issue }}${{ inputs.title && format(' · {0}', inputs.title) || '' }}${{ inputs.subject && format(' · {0}', inputs.subject) || '' }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Spec twin issue number (labelled speckit:spec)
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      guidance:
        description: Guidance for the agent of what stopped (optional)
        required: false
        type: string
      title:
        description: The spec title, for the run name (optional; the implementation pull request title without "Implement:")
        required: false
        type: string
      subject:
        description: What the run will work on, for the run name (optional; decided when it was started)
        required: false
        type: string

permissions: {}

# One chain per spec, shared with the chain before groups (Spec Kit implement spec), so runs of both never overlap:
# GitHub keeps one pending run per group; a replaced pending run is harmless, because every run decides from the state
# on GitHub.
concurrency:
  group: speckit-implement-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  # Merges the base branch when the next work needs it and decides what comes next (Spec Kit implement prepare). A run
  # that finds work of another kind hands it over to that kind's workflow before it starts anything.
  decide:
    name: Prepare the run
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/speckit-implement-prepare.yml
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    with:
      issue: ${{ inputs.issue }}
      pull: ${{ inputs.pull }}
      guidance: ${{ inputs.guidance }}
      workflow: speckit-implement-repair.yml

  # The repair as the single work item of decide, named after the failed verification ("Failed phase verification").
  implement:
    name: ${{ matrix.name }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.action == 'repair' && needs.decide.outputs.verify_only != 'true' }}
    strategy:
      max-parallel: ${{ fromJSON(needs.decide.outputs.max_parallel) }}
      fail-fast: ${{ needs.decide.outputs.mode != 'parallel' }}
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.entries) }}
    uses: ./.github/workflows/speckit-implement-task.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      issue: ${{ inputs.issue }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      kind: ${{ needs.decide.outputs.kind }}
      order: ${{ needs.decide.outputs.order }}
      entry: ${{ toJSON(matrix) }}

  # The reverification, sharded like the phase verification: "prepare" builds the verification scope once (a merge scope
  # merges the base branch at a pinned commit) and plans the shards; every shard and the self-test rebuild exactly that
  # tree (they fail when `git write-tree` differs) and run side by side on their own runners; "verdict" combines them
  # strictly against the plan. Every job that runs workspace code holds only a read-only token.
  prepare:
    name: Prepare the repair verification
    needs: [decide, implement]
    if: >-
      ${{ !cancelled() && needs.decide.outputs.action == 'repair' &&
      (needs.decide.outputs.verify_only == 'true' || needs.implement.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      head: ${{ steps.head.outputs.head }}
      mode: ${{ steps.tree.outputs.mode }}
      environment: ${{ steps.tree.outputs.environment }}
      base_sha: ${{ steps.tree.outputs.base_sha }}
      tree: ${{ steps.tree.outputs.tree }}
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the landed repair
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.verify_only == 'true' && needs.decide.outputs.head || needs.implement.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the original verification scope
        if: ${{ fromJSON(needs.decide.outputs.repair).run != '' && fromJSON(needs.decide.outputs.repair).artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(needs.decide.outputs.repair).artifact }}
          run-id: ${{ fromJSON(needs.decide.outputs.repair).run }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/failed-verification

      - name: Record the verified head
        id: head
        working-directory: workspace
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the verification action
        run: test -f tooling/.github/actions/environment-verify/action.yml

      - name: Prepare the verification tree
        id: tree
        working-directory: workspace
        env:
          BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
          FAILED_HEAD: ${{ fromJSON(needs.decide.outputs.repair).head }}
          SCOPE: ${{ fromJSON(needs.decide.outputs.repair).scope }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          if [ "$SCOPE" = "merge" ]; then
            git fetch --quiet origin "$BASE_BRANCH"
            base_sha="$(git rev-parse "origin/$BASE_BRANCH")"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com merge --no-ff --no-commit "$base_sha"
            git diff --name-only --no-renames "$base_sha"...HEAD > "$SPECKIT_RESULT_DIR/repair-changed-files.txt"
          else
            start="$FAILED_HEAD"
            if ! git merge-base --is-ancestor "$start" HEAD; then start="$(git merge-base "$start" HEAD || true)"; fi
            if ! git diff --name-only --no-renames "$start" HEAD > "$SPECKIT_RESULT_DIR/repair-changed-files.txt"; then
              rm -f "$SPECKIT_RESULT_DIR/repair-changed-files.txt"
            fi
          fi
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { repairVerificationScope } from '../tooling/.github/scripts/speckit-repair.mjs';
          const read = (file) => existsSync(file) ? readFileSync(file, 'utf8') : null;
          const dir = process.env.SPECKIT_RESULT_DIR;
          const result = repairVerificationScope({
            scope: process.env.SCOPE,
            originalChangedFiles: read('../failed-verification/changed-files.txt'),
            repairChangedFiles: read(`${dir}/repair-changed-files.txt`),
          });
          writeFileSync(`${dir}/changed-files.txt`, result.changedFiles.map((file) => `${file}\n`).join(''));
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${result.mode}\nenvironment=${result.environment}\n`);
          console.log(`Repair verification mode: ${result.mode}; ${result.changedFiles.length} changed paths (original scope plus repair).`);
          NODE

      - name: Plan the verification shards
        id: plan
        env:
          MODE: ${{ steps.tree.outputs.mode }}
        run: |
          matrix="$(node tooling/.github/actions/environment-verify/verification-plan.mjs --root workspace --mode "$MODE" --changed-files "$SPECKIT_RESULT_DIR/changed-files.txt" --matrix 4)"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload the prepared scope
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-repair-prepared
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  shards:
    name: Verify the repaired scope
    needs: [decide, prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The fallback only keeps the expression valid when the job is skipped without a plan.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix || '{"include":[{"name":"no plan","shard":"1/1"}]}') }}
    permissions:
      contents: read
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the landed repair
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the prepared scope
        uses: actions/download-artifact@v8
        with:
          name: speckit-repair-prepared
          path: ${{ runner.temp }}/prepared

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Rebuild the planned verification tree
        id: tree
        working-directory: workspace
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PLANNED_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com merge --no-ff --no-commit "$BASE_SHA"
          fi
          tree="$(git write-tree)"
          if [ -z "$PLANNED_TREE" ] || [ "$tree" != "$PLANNED_TREE" ]; then
            echo "::error::The rebuilt verification tree $tree differs from the planned tree ${PLANNED_TREE:-(none)}."
            exit 1
          fi

      - name: Verify the repaired scope
        id: verify
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: ${{ needs.prepare.outputs.mode }}
          changed-files: ${{ runner.temp }}/prepared/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log
          shard: ${{ matrix.shard }}

      # Matrix outputs keep only one shard's values, so each shard records its own for the verdict to combine.
      - name: Record the shard outcome
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          OUTCOME: ${{ steps.tree.outcome == 'failure' && 'verification tree mismatch' || steps.verify.outcome }}
          CHECKS: ${{ steps.verify.outputs.checks }}
          FLAKY: ${{ steps.verify.outputs.flaky }}
          UNCOVERED: ${{ steps.verify.outputs.uncovered }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          printf '%s\n' "$SHARD" > "$SPECKIT_RESULT_DIR/shard.txt"
          printf '%s\n' "$OUTCOME" > "$SPECKIT_RESULT_DIR/outcome.txt"
          printf '%s\n' "$CHECKS" > "$SPECKIT_RESULT_DIR/checks.txt"
          printf '%s\n' "$FLAKY" > "$SPECKIT_RESULT_DIR/flaky.txt"
          printf '%s\n' "$UNCOVERED" > "$SPECKIT_RESULT_DIR/uncovered.txt"

      - name: Upload the shard verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-repair-verification-shard-${{ strategy.job-index }}
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  # A repair of the environment actions exercises their own versions once, beside the shards: the changed setup on a
  # fresh runner, then the changed verification with its own tests only (the shards already ran the component checks).
  selftest:
    name: Self-test the repaired environment actions
    needs: [decide, prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.environment == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the landed repair
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the prepared scope
        uses: actions/download-artifact@v8
        with:
          name: speckit-repair-prepared
          path: ${{ runner.temp }}/prepared

      - name: Rebuild the planned verification tree
        working-directory: workspace
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PLANNED_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com merge --no-ff --no-commit "$BASE_SHA"
          fi
          tree="$(git write-tree)"
          if [ -z "$PLANNED_TREE" ] || [ "$tree" != "$PLANNED_TREE" ]; then
            echo "::error::The rebuilt verification tree $tree differs from the planned tree ${PLANNED_TREE:-(none)}."
            exit 1
          fi

      - name: Self-test the repaired environment setup
        if: hashFiles('workspace/.github/actions/environment-setup/action.yml') != ''
        uses: ./workspace/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Self-test the repaired environment verification
        if: hashFiles('workspace/.github/actions/environment-verify/action.yml') != ''
        uses: ./workspace/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          environment-tests-only: "true"
          changed-files: ${{ runner.temp }}/prepared/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/environment-self-test.log

  # Combines the shards strictly against the plan into the one result later repairs read, speckit-repair-verification,
  # and fails when the verification or the self-test did not pass. It runs no workspace code.
  verdict:
    name: Record the repair verification
    needs: [decide, prepare, shards, selftest]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      head: ${{ needs.prepare.outputs.head }}
      verification: ${{ steps.outcome.outputs.verification }}
      flaky: ${{ steps.combine.outputs.flaky }}
    env:
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the prepared scope
        uses: actions/download-artifact@v8
        with:
          name: speckit-repair-prepared
          path: ${{ env.SPECKIT_RESULT_DIR }}

      - name: Download the shard verifications
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: speckit-repair-verification-shard-*
          path: ${{ runner.temp }}/shards

      - name: Combine the shard verifications
        id: combine
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: node tooling/.github/scripts/speckit-verify-shards.mjs combine "$RUNNER_TEMP/shards" "$SPECKIT_RESULT_DIR" --expect "$MATRIX"

      - name: Decide the verification outcome
        id: outcome
        env:
          COMBINED: ${{ steps.combine.outputs.outcome }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          SELFTEST: ${{ needs.selftest.result }}
        run: |
          verification=success
          [ "$COMBINED" = success ] || verification=failure
          if [ "$ENVIRONMENT" = true ] && [ "$SELFTEST" != success ]; then
            echo "The repaired environment actions failed their self-test ($SELFTEST)."
            verification=failure
          fi
          echo "verification=$verification" >> "$GITHUB_OUTPUT"
          echo "Repair verification: $verification"

      - name: Upload the repair verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-repair-verification
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail on a failed verification
        if: steps.outcome.outputs.verification != 'success'
        run: exit 1
  report:
    name: Report the repair
    concurrency:
      group: speckit-publication-${{ inputs.pull }}
      queue: max
      cancel-in-progress: false
    needs: [decide, implement, prepare, verdict]
    if: >-
      ${{ always() && needs.decide.outputs.action == 'repair' &&
      (needs.decide.outputs.verify_only == 'true' || needs.implement.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Report the repair verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
          SPECKIT_CHECK_RUN: ${{ needs.decide.outputs.check_run }}
          SPECKIT_REPAIR: ${{ needs.decide.outputs.repair }}
          SPECKIT_HEAD: ${{ needs.verdict.outputs.head || needs.prepare.outputs.head || needs.implement.outputs.head }}
          SPECKIT_VERIFY_RESULT: ${{ needs.prepare.result != 'success' && needs.prepare.result || needs.verdict.result }}
          SPECKIT_VERIFICATION_OUTCOME: ${{ needs.verdict.outputs.verification }}
          SPECKIT_VERIFY_FLAKY: ${{ needs.verdict.outputs.flaky }}
        run: node .github/scripts/speckit-repair.mjs repair-report

  # Starts the next run in the workflow of its kind unless this run was cancelled; a stop (attempt limit, diagnosis,
  # review) is decided by the next run.
  continue:
    name: Start the next run
    needs: [decide, report]
    if: ${{ !cancelled() && needs.decide.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start the next run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
        run: node .github/scripts/speckit-spec.mjs continue
