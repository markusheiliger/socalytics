name: Spec Kit implement phase

# One phase of tasks.md (a `##` heading), never started on its own: called by Spec Kit implement spec, whose phase job
# names it after the phase heading as written. It implements the open tasks of the phase, one after another in task
# order; consecutive `[P]` tasks under one heading run in parallel.
#   plan:    "Plan the tasks": decides again from the state on GitHub and, while the phase still comes next,
#            plans the order of its open tasks and shows the attempts of the first task (or first `[P]` tasks) as in
#            progress; it never runs agent-written code
#   groups:  a matrix that runs Spec Kit implement group once per task unit, one job at a
#            time, named after the task IDs ("T013", "T014, T015 in parallel"): tasks land before the next start, and
#            tasks that do not land cancel the tasks after them
#   verify:  the full verification of the phase after its last task (read-only token); each task is verified only with
#            the tests it touched, so a failure here stops the implementation for a diagnosis without using up the
#            attempts of a task.
# A phase whose order needs more than 256 matrix jobs continues in the next run of the spec.
on:
  workflow_call:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      folder:
        description: Spec folder name under specs/
        required: true
        type: string
      base:
        description: Base branch of the implementation pull request, which the implementation merges into and is compared with
        required: true
        type: string
      phase:
        description: The phase heading of tasks.md as written, without "## " (empty for a tasks.md without phases)
        required: false
        type: string
        default: ""
    outputs:
      verified:
        description: Result of the phase verification (success, failure, or skipped)
        value: ${{ jobs.verify.result }}
      flaky:
        description: Comma-separated tests that passed only on their rerun in the phase verification
        value: ${{ jobs.verify.outputs.flaky }}
      order:
        description: The ordered units planned for this phase run
        value: ${{ jobs.plan.outputs.order }}
      phase:
        description: The phase heading
        value: ${{ inputs.phase }}

permissions: {}

jobs:
  plan:
    name: Plan the tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: write
    outputs:
      head: ${{ steps.plan.outputs.head }}
      count: ${{ steps.plan.outputs.count }}
      order: ${{ steps.plan.outputs.order }}
      task_matrix: ${{ steps.plan.outputs.task_matrix }}
      phase_check: ${{ steps.plan.outputs.phase_check }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Plan the tasks
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.twin }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ inputs.folder }}
          SPECKIT_PHASE: ${{ inputs.phase }}
        run: node .github/scripts/speckit-spec.mjs plan-phase

  # One matrix job per task (or per consecutive `[P]` tasks), one at a time and in order; tasks that do not land fail
  # their land job, and fail-fast cancels the tasks after them. GitHub documents the order in which matrix jobs are
  # created; with max-parallel 1 they run in that order. Each entry carries the job name it runs under.
  groups:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.task_matrix) }}
    uses: ./.github/workflows/speckit-implement-group.yml
    permissions:
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      twin: ${{ inputs.twin }}
      pull: ${{ inputs.pull }}
      folder: ${{ inputs.folder }}
      base: ${{ inputs.base }}
      order: ${{ needs.plan.outputs.order }}
      index: ${{ matrix.index }}

  # The phase's full verification after its last task, in its own job (read-only token; it runs agent-written code):
  # each task was verified only with the tests it touched, so a change that breaks other tests shows here, and a
  # failure stops the implementation for a diagnosis instead of using up the attempts of the task that came last.
  verify:
    name: Verify the phase
    needs: [plan, groups]
    if: >-
      !cancelled() && needs.plan.outputs.phase_check == 'true' && needs.groups.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      flaky: ${{ steps.verify.outputs.flaky }}
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      # The chain is the only writer of the branch while it runs, so its tip is what the tasks landed.
      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # All changes of the implementation branch since its base branch, so tasks of the phase that earlier runs
      # implemented are covered too.
      - name: List the changes of the implementation
        working-directory: workspace
        env:
          BASE_BRANCH: ${{ inputs.base }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          git diff --name-only --no-renames "$(git merge-base HEAD "origin/$BASE_BRANCH")" HEAD > "$SPECKIT_RESULT_DIR/changed-files.txt"

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Verify the phase
        if: hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        uses: ./tooling/.github/actions/environment-verify
        id: verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: phase
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Upload the phase verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-phase-verification
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore
