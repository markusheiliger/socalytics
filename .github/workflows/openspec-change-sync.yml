name: OpenSpec change issue sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report actions without changing issues
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "openspec/changes/**"
      - ".github/scripts/openspec-change-core.mjs"
      - ".github/scripts/openspec-change-github.mjs"
      - ".github/scripts/openspec-change-sync.mjs"
      - ".github/workflows/openspec-change-sync.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: openspec-change-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.13.0

      - name: Synchronize issue twins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/openspec-change-sync.mjs
          ${{ inputs.dry_run && '--dry-run' || '' }}
