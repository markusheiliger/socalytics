# Generated by OpenSpec for GitHub Copilot coding agent support.

name: Copilot setup steps

# Runs automatically when changed (for validation) and can be triggered manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    name: Prepare the Copilot coding agent environment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Installations are shared with the OpenSpec and verification workflows via composite actions.
      - name: Set up Node.js and the OpenSpec CLI
        uses: ./.github/actions/setup-openspec

      - name: Set up the repository toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install the Markdown tooling
        run: >-
          npm install --global
          markdownlint-cli2@0.23.3
          markdown-link-check@3.15.0

      - name: Verify repository tooling
        run: |
          openspec --version
          dotnet --version
          markdownlint-cli2 --version
          markdown-link-check --version
