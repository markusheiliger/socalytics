name: Spec Kit prepare

# Keeps one non-authoritative twin issue per Spec Kit feature folder on the default branch and,
# once per newly created twin, infers "blocked by" dependencies between open twins with Copilot CLI.
# The repository stays authoritative for spec content; dependencies are maintained on GitHub after
# the initial inference.
on:
  push:
    branches: [main]
    paths:
      - specs/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report planned twin changes without modifying issues or running inference
        type: boolean
        default: true

permissions: {}

concurrency:
  group: speckit-prepare
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize spec twin issues
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      pending: ${{ steps.sync.outputs.pending }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Synchronize twin issues
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          mkdir -p "$RUNNER_TEMP/speckit-prepare"
          node .github/scripts/speckit-prepare.mjs sync --prompt-file "$RUNNER_TEMP/speckit-prepare/prompt.txt"

      - name: Upload the inference prompt
        if: ${{ steps.sync.outputs.pending == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: speckit-prepare-prompt
          path: ${{ runner.temp }}/speckit-prepare/prompt.txt
          retention-days: 3
          if-no-files-found: error

  infer:
    name: Infer spec dependencies
    needs: sync
    if: needs.sync.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Download the inference prompt
        uses: actions/download-artifact@v8
        with:
          name: speckit-prepare-prompt
          path: ${{ runner.temp }}/speckit-prepare

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      # The prompt holds all context, so the model gets no tools, MCP servers, or repository access.
      - name: Run dependency inference
        working-directory: ${{ runner.temp }}/speckit-prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "$(cat prompt.txt)" -s --available-tools= --disable-builtin-mcps \
            --no-custom-instructions --no-ask-user --no-color --no-auto-update > inference.txt
          cat inference.txt

      - name: Upload the inference output
        uses: actions/upload-artifact@v7
        with:
          name: speckit-prepare-inference
          path: ${{ runner.temp }}/speckit-prepare/inference.txt
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Apply inferred dependencies
    needs: [sync, infer]
    if: needs.infer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the inference output
        uses: actions/download-artifact@v8
        with:
          name: speckit-prepare-inference
          path: ${{ runner.temp }}/speckit-prepare

      - name: Validate and apply dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/speckit-prepare.mjs apply --output-file "$RUNNER_TEMP/speckit-prepare/inference.txt"
