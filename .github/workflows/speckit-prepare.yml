name: Spec Kit prepare

# Keeps one non-authoritative twin issue per Spec Kit feature folder on the default branch and,
# once per newly created twin, infers "blocked by" dependencies between open twins with Copilot CLI.
# Stage labels are generated: when a person adds or removes a speckit:stage:* label, it restores the computed
# label set and explains how to change the state (implementation is requested with `/speckit implement`).
# The repository stays authoritative for spec content; dependencies are maintained on GitHub after
# the initial inference.
on:
  push:
    branches: [main]
    paths:
      - specs/**
  issues:
    types: [labeled, unlabeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report planned twin changes without modifying issues or running inference
        type: boolean
        default: true

permissions: {}

# Label events run in their own group so they never displace a queued sync; only the
# stage label guard itself is serialized per issue (see the job below).
concurrency:
  group: ${{ github.event_name == 'issues' && format('speckit-label-{0}', github.run_id) || 'speckit-prepare' }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  guard-stage:
    name: Restore generated stage labels
    # Label changes by the workflow token start no workflows; a person's change of a stage label is undone.
    if: >-
      github.event_name == 'issues' && startsWith(github.event.label.name, 'speckit:stage:') &&
      github.event.sender.type != 'Bot' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: speckit-request-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Restore the stage labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: node .github/scripts/speckit-prepare.mjs guard-stage --issue "$ISSUE_NUMBER" --actor "$ACTOR" --action "$ACTION" --label "$LABEL"

  sync:
    name: Synchronize spec twin issues
    if: github.event_name != 'issues' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      pending: ${{ steps.sync.outputs.pending }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Synchronize twin issues
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          mkdir -p "$RUNNER_TEMP/speckit-prepare"
          node .github/scripts/speckit-prepare.mjs sync --prompt-file "$RUNNER_TEMP/speckit-prepare/prompt.txt"

      - name: Upload the inference prompt
        if: ${{ steps.sync.outputs.pending == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: speckit-prepare-prompt
          path: ${{ runner.temp }}/speckit-prepare/prompt.txt
          retention-days: 3
          if-no-files-found: error

  infer:
    name: Infer spec dependencies
    needs: sync
    if: needs.sync.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Download the inference prompt
        uses: actions/download-artifact@v8
        with:
          name: speckit-prepare-prompt
          path: ${{ runner.temp }}/speckit-prepare

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Only the speckit-copilot action and its script, from the default branch.
      - name: Check out the Copilot action
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/speckit-copilot
            .github/scripts/speckit-copilot.mjs
          sparse-checkout-cone-mode: false

      # The prompt holds all context, so the model gets no tools, MCP servers, or repository access.
      - name: Run dependency inference
        id: infer
        uses: ./tooling/.github/actions/speckit-copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          level: light
          mode: inference
          prompt-file: prompt.txt
          timeout: 10m
          working-directory: ${{ runner.temp }}/speckit-prepare
          output-file: ${{ runner.temp }}/speckit-prepare/inference.txt

      # Fails the job when Copilot CLI failed, so no inference is applied.
      - name: Show the inference output
        env:
          EXIT_CODE: ${{ steps.infer.outputs.exit-code }}
        run: |
          cat "$RUNNER_TEMP/speckit-prepare/inference.txt"
          exit "${EXIT_CODE:-1}"

      - name: Upload the inference output
        uses: actions/upload-artifact@v7
        with:
          name: speckit-prepare-inference
          path: ${{ runner.temp }}/speckit-prepare/inference.txt
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Apply inferred dependencies
    needs: [sync, infer]
    if: needs.infer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the inference output
        uses: actions/download-artifact@v8
        with:
          name: speckit-prepare-inference
          path: ${{ runner.temp }}/speckit-prepare

      - name: Validate and apply dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/speckit-prepare.mjs apply --output-file "$RUNNER_TEMP/speckit-prepare/inference.txt"

  # Runs that the workflow token dispatched (after an automatic merge) do not reliably start Spec Kit orchestrate through
  # its workflow_run trigger, so a dispatched, applying run starts the scheduler itself.
  schedule:
    name: Start the scheduler
    needs: [sync, apply]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && !inputs.dry_run &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.sync.result == 'success' && needs.apply.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start Spec Kit orchestrate
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run speckit-orchestrate.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
