name: Spec Kit implement decide

# The implementation chain of one spec: every run prepares itself (Spec Kit implement prepare: merge the base branch,
# decide what comes next), does one unit of work, and starts the next run in the workflow of that work's kind, until the
# implementation is merged, waits for review, or needs a person:
#   speckit-implement-group.yml    a sequential or parallel group of tasks (also the convergence or a conflict
#                                  resolution as a group of one)
#   speckit-implement-verify.yml   the verification of a finished phase
#   speckit-implement-repair.yml   a writer-approved repair of landed code
#   speckit-implement-merge.yml    the merge
# This workflow is the run that only decides: the next work was none of these when it was started (a stop at an
# attempt limit, a failure that waits for a diagnosis or a person, a merge that is still running, a finished
# implementation), or it could not be told. Its preparation decides and acts on the decision (it reports the stop,
# starts the diagnosis, or marks the implementation done), and the chain ends here; work it finds after all is handed
# over to the workflow of its kind. All workflows of the chain share one concurrency group per spec, so two runs never
# work on one spec at the same time. The GitHub workflows own the flow and the state; the agents' work runs in the gha
# Spec Kit workflows through Spec Kit implement task.
# Runs are named "Spec Kit implement spec #<twin> · <spec title> · <what the run works on>".
run-name: >-
  Spec Kit implement spec #${{ inputs.issue }}${{ inputs.title && format(' · {0}', inputs.title) || '' }}${{ inputs.subject && format(' · {0}', inputs.subject) || '' }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Spec twin issue number (labelled speckit:spec)
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      guidance:
        description: Guidance for the agent of what stopped (optional)
        required: false
        type: string
      title:
        description: The spec title, for the run name (optional; the implementation pull request title without "Implement:")
        required: false
        type: string
      subject:
        description: What the run will work on, for the run name (optional; decided when it was started)
        required: false
        type: string

permissions: {}

# One chain per spec, shared with the chain before groups (Spec Kit implement spec), so runs of both never overlap:
# GitHub keeps one pending run per group; a replaced pending run is harmless, because every run decides from the state
# on GitHub.
concurrency:
  group: speckit-implement-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  # Merges the base branch when the next work needs it and decides what comes next (Spec Kit implement prepare). A run
  # that finds work of another kind hands it over to that kind's workflow before it starts anything.
  decide:
    name: Prepare the run
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/speckit-implement-prepare.yml
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    with:
      issue: ${{ inputs.issue }}
      pull: ${{ inputs.pull }}
      guidance: ${{ inputs.guidance }}
      workflow: speckit-implement-decide.yml

  # Starts the next run in the workflow of its kind unless this run was cancelled; a stop (attempt limit, diagnosis,
  # review) is decided by the next run.
  continue:
    name: Start the next run
    needs: decide
    if: ${{ !cancelled() && needs.decide.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start the next run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
        run: node .github/scripts/speckit-spec.mjs continue
