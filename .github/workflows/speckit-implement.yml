name: Spec Kit implement

# Implements exactly one task of a spec, or finalizes it, on its speckit/<folder> branch. Started by the
# Spec Kit orchestrate workflow; the hand-back job starts the orchestrator again when the run ends.
#   begin:     checks that the inputs still match the state and marks the attempt as in progress
#   work:      runs the agent and the verification with a read-only token
#   land:      re-validates, commits, pushes, and reports; it never runs agent-written code
#   hand-back: dispatches the orchestrator with this run id, whatever the outcome
run-name: "Spec Kit implement #${{ inputs.twin }} ${{ inputs.task }} attempt ${{ inputs.attempt }}"

on:
  workflow_dispatch:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      task:
        description: Task ID (T###) or finalize
        required: true
        type: string
      attempt:
        description: Attempt number
        required: true
        type: string

permissions: {}

concurrency:
  group: speckit-implement-${{ inputs.twin }}
  cancel-in-progress: false

env:
  SPECKIT_TWIN: ${{ inputs.twin }}
  SPECKIT_PULL: ${{ inputs.pull }}
  SPECKIT_TASK: ${{ inputs.task }}
  SPECKIT_ATTEMPT: ${{ inputs.attempt }}

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  begin:
    name: Check the task and mark the attempt
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: write
    outputs:
      proceed: ${{ steps.begin.outputs.proceed }}
      folder: ${{ steps.begin.outputs.folder }}
      head: ${{ steps.begin.outputs.head }}
      check_run: ${{ steps.begin.outputs.check_run }}
      mode: ${{ steps.begin.outputs.mode }}
      prompt: ${{ steps.begin.outputs.prompt }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the inputs and mark the attempt
        id: begin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/speckit-implement.mjs begin

  work:
    name: Implement and verify
    needs: begin
    if: needs.begin.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      copilot-requests: write
    env:
      SPECKIT_FOLDER: ${{ needs.begin.outputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.begin.outputs.head }}
          path: workspace
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: workspace/src/platform/global.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python for the Spec Kit scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Markdown linters and Copilot CLI
        run: npm install --global markdownlint-cli2@0.23.3 markdown-link-check@3.15.0 @github/copilot

      # The token reaches Copilot CLI only as COPILOT_GITHUB_TOKEN, which --secret-env-vars strips from the
      # agent's shells. The job token is read-only, so even a leaked token cannot push.
      - name: Implement the task with Copilot CLI
        if: needs.begin.outputs.mode == 'task'
        working-directory: workspace
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          SPECIFY_FEATURE_DIRECTORY: specs/${{ needs.begin.outputs.folder }}
          PROMPT: ${{ needs.begin.outputs.prompt }}
          AI_CREDITS: ${{ vars.SPECKIT_TASK_AI_CREDITS || '1000' }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          set +e
          timeout --kill-after=60s 60m copilot -p "$PROMPT" \
            --no-ask-user --no-auto-update --allow-all-tools --disable-builtin-mcps \
            --deny-tool 'shell(git push:*)' --deny-tool 'shell(gh:*)' \
            --deny-tool 'shell(curl:*)' --deny-tool 'shell(wget:*)' \
            --secret-env-vars=COPILOT_GITHUB_TOKEN --max-ai-credits "$AI_CREDITS" \
            --output-format json > "$SPECKIT_RESULT_DIR/agent.jsonl"
          echo "$?" > "$SPECKIT_RESULT_DIR/agent-exit.txt"

      - name: Package and verify the change
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-implement.mjs" work

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-task-result
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  land:
    name: Land the change and report
    needs: [begin, work]
    if: always() && needs.begin.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: write
    env:
      SPECKIT_FOLDER: ${{ needs.begin.outputs.folder }}
      SPECKIT_CHECK_RUN: ${{ needs.begin.outputs.check_run }}
      SPECKIT_WORK_RESULT: ${{ needs.work.result }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.begin.outputs.head }}
          path: workspace
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the work result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-task-result
          path: ${{ github.workspace }}/speckit-result

      - name: Land the change and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/.github/scripts/speckit-implement.mjs land

  # GitHub raises no workflow_run event for these runs, so the hand-back is an explicit dispatch.
  hand-back:
    name: Hand back to the orchestrator
    needs: [begin, work, land]
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Spec Kit orchestrate workflow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          gh workflow run speckit-orchestrate.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          -f after_run="$GITHUB_RUN_ID"
