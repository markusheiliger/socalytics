name: Spec Kit implement

# The implementation chain of one spec: every run decides one unit of work from the state on GitHub, runs it, and starts
# the next run, until the implementation is merged, waits for review, or needs a person. Started by the scheduler (Spec
# Kit orchestrate), by itself, by `/speckit retry` comments, when an amendment is merged, and when a fix spec has landed.
# The GitHub workflow owns the flow and the state; the agents' work runs in the gha Spec Kit workflows through Spec Kit
# implement work.
# Runs are named "Spec Kit implement spec #<twin> · <spec title> · <what the run works on>". Every run first brings the
# base branch in when the next work needs it, decides what comes next, runs exactly one alternative (the others show
# as skipped), and then starts the next run:
#   sync:          "Merge the base branch": pull model. When the next work starts a phase (none of its tasks ticked),
#                  the convergence, or the merge, it merges the base branch into the implementation branch through the
#                  GitHub API (repository variable SPECKIT_SYNC_BASE, default true). A conflict is recorded on the
#                  head, and decide starts the conflict resolution in the same run: best effort before a phase or the
#                  convergence, required before the merge. A durable /speckit sync request selects the conflict
#                  resolution irrespective of SPECKIT_SYNC_BASE (write token, never runs agent-written code).
#   decide:        "Decide what comes next": validates the twin, reports stops (attempt limit, diagnosis), and decides
#                  the unit of this run.
#   sequential:    a sequential group: consecutive tasks without `[P]` of one phase, one matrix job per task, one at a
#                  time (max-parallel 1); a task that does not land cancels the tasks after it, and the next run
#                  continues from there. The convergence and a conflict resolution run here as a group of one.
#   parallel:      a parallel group: consecutive `[P]` tasks under one heading, one matrix job per task, at most
#                  MAX_PARALLEL_TASKS (5) at a time; followed by "Verify the parallel tasks together" when a landing
#                  merged a sibling's edits to the same files three-way, and by its report.
#   verify:        "Verify <phase>": the full verification of a finished phase, a run of its own after the phase's last
#                  group; a failure stops for a person with a pending repair.
#   repair:        a writer-approved repair of landed code, its reverification, and its report.
#   merge:         archives the spec, verifies the prospective merged tree, then squash-merges the pull request or asks
#                  for review.
#   continue:      "Start the next run": dispatches the next run of the chain, named after what it will work on.
run-name: >-
  Spec Kit implement spec #${{ inputs.issue }}${{ inputs.title && format(' · {0}', inputs.title) || '' }}${{ inputs.subject && format(' · {0}', inputs.subject) || '' }}

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Spec twin issue number (labelled speckit:spec)
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      guidance:
        description: Guidance for the agent of what stopped (optional)
        required: false
        type: string
      title:
        description: The spec title, for the run name (optional; the implementation pull request title without "Implement:")
        required: false
        type: string
      subject:
        description: What the run will work on, for the run name (optional; decided when it was started)
        required: false
        type: string

permissions: {}

# One chain per spec, shared with the chain before groups (Spec Kit implement spec), so runs of both never overlap:
# GitHub keeps one pending run per group; a replaced pending run is harmless, because every run decides from the state
# on GitHub.
concurrency:
  group: speckit-implement-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  sync:
    name: Merge the base branch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: speckit-publication-${{ inputs.pull }}
      queue: max
      cancel-in-progress: false
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    outputs:
      spec: ${{ steps.issue.outputs.spec }}
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the spec issue
        id: issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_ISSUE: ${{ inputs.issue }}
        run: node .github/scripts/speckit-issue.mjs check

      - name: Merge the base branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_SYNC_BASE: ${{ vars.SPECKIT_SYNC_BASE || 'true' }}
        run: node .github/scripts/speckit-spec.mjs sync

  decide:
    name: Decide what comes next
    needs: sync
    # Decides even when the merge of the base branch failed (the work then continues on the current base), but only for
    # a spec twin.
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.sync.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never runs agent-written code. contents: write lets a diagnosis it starts delete a superseded amendment branch.
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      action: ${{ steps.decide.outputs.action }}
      continue: ${{ steps.decide.outputs.continue }}
      folder: ${{ steps.decide.outputs.folder }}
      head: ${{ steps.decide.outputs.head }}
      base_branch: ${{ steps.decide.outputs.base_branch }}
      kind: ${{ steps.decide.outputs.kind }}
      mode: ${{ steps.decide.outputs.mode }}
      entries: ${{ steps.decide.outputs.entries }}
      order: ${{ steps.decide.outputs.order }}
      phase: ${{ steps.decide.outputs.phase }}
      tasks: ${{ steps.decide.outputs.tasks }}
      job_name: ${{ steps.decide.outputs.job_name }}
      attempt: ${{ steps.decide.outputs.attempt }}
      check_run: ${{ steps.decide.outputs.check_run }}
      repair: ${{ steps.decide.outputs.repair }}
      entry: ${{ steps.decide.outputs.entry }}
      verify_only: ${{ steps.decide.outputs.verify_only }}
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decide what comes next
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_GUIDANCE: ${{ inputs.guidance }}
        run: node .github/scripts/speckit-spec.mjs decide

  # ── Groups ──────────────────────────────────────────────────────────────────────────────────────────────────────────
  # One matrix job per task, one at a time and in order (GitHub runs matrix jobs in the order it created them when
  # max-parallel is 1); a task that does not land fails its land job, and fail-fast cancels the tasks after it.
  sequential:
    name: ${{ matrix.name }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'group' && needs.decide.outputs.mode == 'sequential' }}
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.entries) }}
    uses: ./.github/workflows/speckit-implement-work.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      issue: ${{ inputs.issue }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      kind: ${{ needs.decide.outputs.kind }}
      order: ${{ needs.decide.outputs.order }}
      entry: ${{ toJSON(matrix) }}

  # One matrix job per task, at most 5 at a time; every task lands on its own (siblings' edits are merged three-way).
  parallel:
    name: ${{ matrix.name }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'group' && needs.decide.outputs.mode == 'parallel' }}
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.decide.outputs.entries) }}
    uses: ./.github/workflows/speckit-implement-work.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      issue: ${{ inputs.issue }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      kind: implement
      order: ${{ needs.decide.outputs.order }}
      entry: ${{ toJSON(matrix) }}

  # Only a landing that merged a sibling's edits to the same files three-way adds a risk the tasks' own verifications
  # did not cover; it records those files in its commit message (read-only token; it runs agent-written code).
  group-verify:
    name: Verify the parallel tasks together
    needs: [decide, parallel]
    if: always() && needs.decide.outputs.mode == 'parallel' && needs.parallel.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      head: ${{ steps.head.outputs.head }}
      combined: ${{ steps.combined.outputs.combined }}
      flaky: ${{ steps.verify.outputs.flaky }}
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the parallel result
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ needs.decide.outputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: List the group changes
        working-directory: workspace
        env:
          GROUP_START: ${{ needs.decide.outputs.head }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          git diff --name-only --no-renames "$GROUP_START" HEAD > "$SPECKIT_RESULT_DIR/changed-files.txt"

      - name: Record the verified head
        id: head
        working-directory: workspace
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Find combined edits
        id: combined
        env:
          SPECKIT_GROUP_START: ${{ needs.decide.outputs.head }}
        run: node tooling/.github/scripts/speckit-group.mjs combined-edits

      - name: Set up the solution environment
        if: steps.combined.outputs.combined == 'true' && hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Verify the combined group
        if: steps.combined.outputs.combined == 'true' && hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        uses: ./tooling/.github/actions/environment-verify
        id: verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: task
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Upload the group verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-group-verification
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  group-report:
    name: Report the group verification
    needs: [decide, parallel, group-verify]
    if: always() && needs.decide.outputs.mode == 'parallel' && needs.parallel.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Report the verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
          SPECKIT_ORDER: ${{ needs.decide.outputs.order }}
          SPECKIT_ORDER_INDEX: "0"
          SPECKIT_HEAD: ${{ needs.group-verify.outputs.head }}
          SPECKIT_LAND_OK: "true"
          SPECKIT_VERIFY_RESULT: ${{ needs.group-verify.result }}
          SPECKIT_COMBINED: ${{ needs.group-verify.outputs.combined || 'true' }}
          SPECKIT_VERIFY_FLAKY: ${{ needs.group-verify.outputs.flaky }}
        run: node .github/scripts/speckit-group.mjs combined-verified

  # ── Verification of a finished phase ───────────────────────────────────────────────────────────────────────────────
  # The full verification of the phase in a run of its own (read-only token; it runs agent-written code): each task was
  # verified only with the tests it touched, so a change that breaks other tests shows here, and a failure stops the
  # implementation for a diagnosis instead of using up the attempts of the task that came last.
  verify:
    name: Verify the phase
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      head: ${{ steps.head.outputs.head }}
      flaky: ${{ steps.verify.outputs.flaky }}
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Record the verified head
        id: head
        working-directory: workspace
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # All changes of the implementation branch since its base branch, so tasks of the phase that earlier runs
      # implemented are covered too.
      - name: List the changes of the implementation
        working-directory: workspace
        env:
          BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          git diff --name-only --no-renames "$(git merge-base HEAD "origin/$BASE_BRANCH")" HEAD > "$SPECKIT_RESULT_DIR/changed-files.txt"

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Verify the phase
        if: hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        uses: ./tooling/.github/actions/environment-verify
        id: verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: phase
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Upload the phase verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-phase-verification
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  verify-report:
    name: Record the phase verification
    needs: [decide, verify]
    if: ${{ always() && needs.decide.result == 'success' && needs.decide.outputs.action == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Record the phase verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
          SPECKIT_PHASE: ${{ needs.decide.outputs.phase }}
          SPECKIT_TASKS: ${{ needs.decide.outputs.tasks }}
          SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
          SPECKIT_CHECK_RUN: ${{ needs.decide.outputs.check_run }}
          SPECKIT_HEAD: ${{ needs.verify.outputs.head || needs.decide.outputs.head }}
          SPECKIT_VERIFY_RESULT: ${{ needs.verify.result }}
          SPECKIT_VERIFY_FLAKY: ${{ needs.verify.outputs.flaky }}
        run: node .github/scripts/speckit-spec.mjs verify-report

  # ── Repair ──────────────────────────────────────────────────────────────────────────────────────────────────────────
  # A writer-approved repair of already-landed code after a verification failure; without guidance only the
  # reverification runs.
  repair:
    name: ${{ needs.decide.outputs.action == 'repair' && needs.decide.outputs.job_name || 'Repair verification failure' }}
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'repair' && needs.decide.outputs.verify_only != 'true' }}
    uses: ./.github/workflows/speckit-implement-work.yml
    permissions:
      actions: read
      checks: write
      contents: write
      copilot-requests: write
      issues: read
      pull-requests: write
    with:
      issue: ${{ inputs.issue }}
      pull: ${{ inputs.pull }}
      folder: ${{ needs.decide.outputs.folder }}
      base: ${{ needs.decide.outputs.base_branch }}
      kind: repair
      order: ${{ needs.decide.outputs.order }}
      entry: ${{ needs.decide.outputs.entry }}

  repair-verify:
    name: Verify the repair
    needs: [decide, repair]
    if: >-
      ${{ !cancelled() && needs.decide.outputs.action == 'repair' &&
      (needs.decide.outputs.verify_only == 'true' || needs.repair.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      head: ${{ steps.head.outputs.head }}
      verification: ${{ steps.verification.outcome }}
      flaky: ${{ steps.verification.outputs.flaky }}
    env:
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the landed repair
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide.outputs.verify_only == 'true' && needs.decide.outputs.head || needs.repair.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the original verification scope
        if: ${{ fromJSON(needs.decide.outputs.repair).run != '' && fromJSON(needs.decide.outputs.repair).artifact != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ fromJSON(needs.decide.outputs.repair).artifact }}
          run-id: ${{ fromJSON(needs.decide.outputs.repair).run }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/failed-verification

      - name: Record the verified head
        id: head
        working-directory: workspace
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require the verification action
        run: test -f tooling/.github/actions/environment-verify/action.yml

      - name: Prepare the verification tree
        id: tree
        working-directory: workspace
        env:
          BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
          FAILED_HEAD: ${{ fromJSON(needs.decide.outputs.repair).head }}
          SCOPE: ${{ fromJSON(needs.decide.outputs.repair).scope }}
        run: |
          mkdir -p "$SPECKIT_RESULT_DIR"
          if [ "$SCOPE" = "merge" ]; then
            git fetch --quiet origin "$BASE_BRANCH"
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com merge --no-ff --no-commit "origin/$BASE_BRANCH"
            git diff --name-only --no-renames "origin/$BASE_BRANCH"...HEAD > "$SPECKIT_RESULT_DIR/repair-changed-files.txt"
          else
            start="$FAILED_HEAD"
            if ! git merge-base --is-ancestor "$start" HEAD; then start="$(git merge-base "$start" HEAD || true)"; fi
            if ! git diff --name-only --no-renames "$start" HEAD > "$SPECKIT_RESULT_DIR/repair-changed-files.txt"; then
              rm -f "$SPECKIT_RESULT_DIR/repair-changed-files.txt"
            fi
          fi
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { repairVerificationScope } from '../tooling/.github/scripts/speckit-repair.mjs';
          const read = (file) => existsSync(file) ? readFileSync(file, 'utf8') : null;
          const dir = process.env.SPECKIT_RESULT_DIR;
          const result = repairVerificationScope({
            scope: process.env.SCOPE,
            originalChangedFiles: read('../failed-verification/changed-files.txt'),
            repairChangedFiles: read(`${dir}/repair-changed-files.txt`),
          });
          writeFileSync(`${dir}/changed-files.txt`, result.changedFiles.map((file) => `${file}\n`).join(''));
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${result.mode}\nenvironment=${result.environment}\n`);
          console.log(`Repair verification mode: ${result.mode}; ${result.changedFiles.length} changed paths (original scope plus repair).`);
          NODE

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Verify the repaired scope
        id: verification
        if: hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: ${{ steps.tree.outputs.mode }}
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Self-test the repaired environment setup
        if: >-
          steps.tree.outputs.environment == 'true' &&
          hashFiles('workspace/.github/actions/environment-setup/action.yml') != ''
        uses: ./workspace/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Self-test the repaired environment verification
        if: >-
          steps.tree.outputs.environment == 'true' &&
          hashFiles('workspace/.github/actions/environment-verify/action.yml') != ''
        uses: ./workspace/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/environment-self-test.log

      - name: Upload the repair verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-repair-verification
          path: ${{ env.SPECKIT_RESULT_DIR }}
          retention-days: 7
          if-no-files-found: ignore

  repair-report:
    name: Report the repair
    concurrency:
      group: speckit-publication-${{ inputs.pull }}
      queue: max
      cancel-in-progress: false
    needs: [decide, repair, repair-verify]
    if: >-
      ${{ always() && needs.decide.outputs.action == 'repair' &&
      (needs.decide.outputs.verify_only == 'true' || needs.repair.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Report the repair verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
          SPECKIT_CHECK_RUN: ${{ needs.decide.outputs.check_run }}
          SPECKIT_REPAIR: ${{ needs.decide.outputs.repair }}
          SPECKIT_HEAD: ${{ needs.repair-verify.outputs.head || needs.repair.outputs.head }}
          SPECKIT_VERIFY_RESULT: ${{ needs.repair-verify.result }}
          SPECKIT_VERIFICATION_OUTCOME: ${{ needs.repair-verify.outputs.verification }}
          SPECKIT_VERIFY_FLAKY: ${{ needs.repair-verify.outputs.flaky }}
        run: node .github/scripts/speckit-repair.mjs repair-report

  # ── Merge ───────────────────────────────────────────────────────────────────────────────────────────────────────────
  # Write token, trusted tooling, and no agent-written code. The archive lands with the implementation, so the base
  # branch never receives references to an active spec folder that no longer exists.
  merge-archive:
    name: Archive the spec before the merge
    needs: decide
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.action == 'merge' }}
    concurrency:
      group: speckit-publication-${{ inputs.pull }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    outputs:
      head: ${{ steps.archive.outputs.head }}
      check_run: ${{ steps.archive.outputs.check_run }}
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ needs.decide.outputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Archive the spec
        id: archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
          SPECKIT_PULL: ${{ inputs.pull }}
          SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
          SPECKIT_HEAD: ${{ needs.decide.outputs.head }}
          SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
          SPECKIT_CHECK_RUN: ${{ needs.decide.outputs.check_run }}
          SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
        run: node tooling/.github/scripts/speckit-merge.mjs archive

  # Runs the prospective merged tree and therefore holds only a read-only token.
  merge-verify:
    name: Verify the merged result
    needs: [decide, merge-archive]
    if: ${{ !cancelled() && needs.merge-archive.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ needs.decide.outputs.base_branch }}
      SPECKIT_TWIN: ${{ inputs.issue }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
      SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.merge-archive.outputs.head }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Build the prospective merged tree
        id: integrate
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-merge.mjs" integrate

      - name: Verify the merged result
        id: verify
        if: >-
          steps.integrate.outputs.verify == 'true' &&
          hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      # Environment specs change the trusted actions that later implementations load. Exercise their own versions on
      # the prospective merged tree once before allowing the merge.
      - name: Self-test the changed environment setup
        id: selftest-setup
        if: >-
          steps.integrate.outputs.environment == 'true' &&
          hashFiles('workspace/.github/actions/environment-setup/action.yml') != ''
        continue-on-error: true
        uses: ./workspace/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Self-test the changed environment verification
        id: selftest-verify
        if: >-
          steps.integrate.outputs.environment == 'true' &&
          steps.selftest-setup.outcome != 'failure' &&
          hashFiles('workspace/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./workspace/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/selftest.log

      - name: Record the verdict
        env:
          SPECKIT_VERIFY_CONFIGURED: ${{ hashFiles('tooling/.github/actions/environment-verify/action.yml') != '' }}
          SPECKIT_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SPECKIT_VERIFY_CHECKS: ${{ steps.verify.outputs.checks }}
          SPECKIT_VERIFY_UNCOVERED: ${{ steps.verify.outputs.uncovered }}
          SPECKIT_VERIFY_FLAKY: ${{ steps.verify.outputs.flaky }}
          SPECKIT_SELFTEST_OUTCOME: >-
            ${{ steps.selftest-setup.outcome == 'failure' && 'failure' || steps.selftest-verify.outcome }}
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-merge.mjs" verdict

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-merge-result
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  # API only: never checks out or runs workspace code.
  merge-land:
    name: Merge into the base branch
    concurrency:
      group: speckit-publication-${{ inputs.pull }}
      queue: max
      cancel-in-progress: false
    needs: [decide, merge-archive, merge-verify]
    if: ${{ always() && needs.decide.result == 'success' && needs.decide.outputs.action == 'merge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_TWIN: ${{ inputs.issue }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ needs.decide.outputs.attempt }}
      SPECKIT_FOLDER: ${{ needs.decide.outputs.folder }}
      SPECKIT_CHECK_RUN: ${{ needs.merge-archive.outputs.check_run || needs.decide.outputs.check_run }}
      SPECKIT_WORK_RESULT: ${{ needs.merge-archive.result != 'success' && format('archive {0}', needs.merge-archive.result) || needs.merge-verify.result }}
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the verification result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-merge-result
          path: ${{ github.workspace }}/speckit-result

      - name: Merge and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_AUTO_MERGE: ${{ vars.SPECKIT_AUTO_MERGE || 'true' }}
        run: node .github/scripts/speckit-merge.mjs merge-land

  # Starts the next run unless this run was cancelled; a stop (attempt limit, diagnosis, review) is decided by the next
  # run's decide job.
  continue:
    name: Start the next run
    needs: [sync, decide, sequential, parallel, group-report, verify-report, repair-report, merge-land]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start the next run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_TWIN: ${{ inputs.issue }}
          SPECKIT_PULL: ${{ inputs.pull }}
        run: node .github/scripts/speckit-spec.mjs continue
