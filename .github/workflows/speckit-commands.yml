name: Spec Kit commands

# Handles people's input on Spec Kit pull requests:
# - `/speckit <command>` comments on implementation pull requests: retry, sync, amend, author, help;
#   and on spec twin issues (label speckit:spec): implement (the only way to request an implementation), help.
#   - Feedback on amendment pull requests (speckit-amend/<folder>) and authored spec pull requests
#     (speckit-spec/<folder>, earlier speckit-fix/<folder>): a comment, or a review with Comment or Request changes,
#     has it reworked (Spec Kit diagnose or Spec Kit author, mode revise) and checked again (Spec Kit analyze).
#   - Closing an amendment pull request: merged (the implementation continues) or discarded; closing an authored spec
#     pull request: merged (its twin is implemented next, and the stopped implementation, which depends on it, retries
#     once it is implemented) or discarded. A person's push to such a branch is checked again.
#   - Guard: Spec Kit pull requests are removed from pull request stacks, an amendment's base branch is set back to
#     its implementation branch, and an authored spec's to the default branch (the scheduler, Spec Kit orchestrate,
#     does the same on every run, also for events this job cannot see).
#   - A `@copilot` request on a stopped implementation pull request hands it to Copilot's cloud agent: the pull
#     request stops asking for help until the scheduler sees that Copilot ended without a push.
# Only people with write access are heard; comments and reviews by bots never trigger. Reviews arrive through a small
# forwarder job, because GitHub runs pull_request_review workflows from the pull request's merge ref; it only
# dispatches this workflow on the default branch, where everything else runs.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      pull:
        description: Amendment pull request whose feedback to handle (set by the review forwarder)
        required: true
        type: string

# Every run says which pull request or issue it handles: GitHub would otherwise name it after the pull request title
# alone ("Implement: …", "Amend: …").
run-name: "${{ github.event_name == 'issue_comment' && format('Spec Kit commands · comment on #{0} · {1}', github.event.issue.number, github.event.issue.title) || github.event_name == 'pull_request_review' && format('Spec Kit commands · review of pull request #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event_name == 'pull_request_target' && format('Spec Kit commands · pull request #{0} {1} · {2}', github.event.pull_request.number, github.event.action, github.event.pull_request.title) || format('Spec Kit commands · feedback on pull request #{0}', inputs.pull) }}"

permissions: {}

jobs:
  target:
    name: Resolve the command publication target
    if: >-
      github.event_name == 'issue_comment' &&
      (github.event.issue.pull_request || contains(github.event.issue.labels.*.name, 'speckit:spec')) &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/speckit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull: ${{ steps.target.outputs.pull }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Resolve the implementation pull request
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_PULL: ${{ github.event.issue.number }}
          SPECKIT_TARGET: ${{ github.event.issue.pull_request && 'pull' || 'twin' }}
          SPECKIT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/speckit-commands.mjs target

  command:
    name: Handle the /speckit command
    needs: target
    # issue_comment always uses this workflow from the default branch; no job checks out pull request code.
    if: >-
      github.event_name == 'issue_comment' &&
      (github.event.issue.pull_request || contains(github.event.issue.labels.*.name, 'speckit:spec')) &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/speckit')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Atomic with all branch publication jobs; queue rather than replacing pending commands or parallel task landings.
    concurrency:
      group: speckit-publication-${{ needs.target.outputs.pull }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The comment reaches the script only through the environment, never through the workflow expression syntax.
      - name: Run the command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.issue.number }}
          SPECKIT_COMMENT_ID: ${{ github.event.comment.id }}
          SPECKIT_ACTOR: ${{ github.event.comment.user.login }}
          SPECKIT_COMMENT_BODY: ${{ github.event.comment.body }}
          SPECKIT_PUBLICATION_PULL: ${{ needs.target.outputs.pull }}
          SPECKIT_TARGET: ${{ github.event.issue.pull_request && 'pull' || 'twin' }}
        run: node .github/scripts/speckit-commands.mjs command

  feedback:
    name: Handle amendment or authored spec feedback
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      !startsWith(github.event.comment.body, '/speckit')) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # Waits up to 20 minutes for a running check or rework before starting the rework.
    timeout-minutes: 30
    concurrency:
      group: speckit-feedback-${{ github.event.issue.number || inputs.pull }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The script ignores pull requests that are not amendments or authored specs, and people without write access.
      - name: Handle the feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.issue.number || inputs.pull }}
          SPECKIT_COMMENT_ID: ${{ github.event.comment.id }}
          SPECKIT_ACTOR: ${{ github.event.comment.user.login }}
        run: node .github/scripts/speckit-amend.mjs feedback

  # A writer's `@copilot` request on a stopped implementation pull request hands it to GitHub Copilot's cloud agent: the
  # pull request stops asking for help, because Copilot's push continues the implementation by itself. The script
  # ignores other pull requests, people without write access, and implementations that do not wait for a person.
  copilot-handoff:
    name: Hand a stopped implementation over to Copilot
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@copilot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The comment reaches the script only through the environment, never through the workflow expression syntax.
      - name: Hand the implementation over to Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_PULL: ${{ github.event.issue.number }}
          SPECKIT_ACTOR: ${{ github.event.comment.user.login }}
          SPECKIT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/speckit-commands.mjs copilot-handoff

  forward-review:
    name: Forward amendment or authored spec review
    # Runs from the pull request's merge ref; it only hands the review to this workflow on the default branch.
    if: >-
      github.event_name == 'pull_request_review' &&
      (startsWith(github.event.pull_request.head.ref, 'speckit-amend/') ||
      startsWith(github.event.pull_request.head.ref, 'speckit-spec/') ||
      startsWith(github.event.pull_request.head.ref, 'speckit-fix/')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.type != 'Bot' &&
      github.event.review.state != 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the feedback handling on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL: ${{ github.event.pull_request.number }}
        run: gh workflow run speckit-commands.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f pull="$PULL"

  amendment:
    name: Handle amendment or authored spec push or close
    # A person merged or closed an amendment or authored spec pull request, or pushed to its branch. Pushes and
    # closes by the workflow token raise no events.
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'closed' || github.event.action == 'synchronize') &&
      (startsWith(github.event.pull_request.head.ref, 'speckit-amend/') ||
      startsWith(github.event.pull_request.head.ref, 'speckit-spec/') ||
      startsWith(github.event.pull_request.head.ref, 'speckit-fix/')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: speckit-feedback-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Handle the change
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.pull_request.number }}
          SPECKIT_ACTOR: ${{ github.event.sender.login }}
          EVENT_ACTION: ${{ github.event.action }}
        run: node .github/scripts/speckit-amend.mjs "$([ "$EVENT_ACTION" = closed ] && echo closed || echo pushed)"

  guard:
    name: Enforce Spec Kit pull request topology
    # Runs from the pull request's base branch: a base changed to the default branch, and every event of an
    # implementation pull request, use this job from the default branch.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      (startsWith(github.event.pull_request.head.ref, 'speckit-amend/') ||
      startsWith(github.event.pull_request.head.ref, 'speckit-spec/') ||
      startsWith(github.event.pull_request.head.ref, 'speckit-fix/') ||
      startsWith(github.event.pull_request.head.ref, 'speckit/')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: speckit-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Guard the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.pull_request.number }}
        run: node .github/scripts/speckit-amend.mjs guard