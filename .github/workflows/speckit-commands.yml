name: Spec Kit commands

# Handles `/speckit <command>` comments on Spec Kit implementation pull requests (speckit/<folder>) and their
# amendment pull requests (speckit-amend/<folder>): diagnose, revise, apply, discard, resume, sync, help. Only people
# with write access can use them; comments by bots never trigger. The diagnosis itself runs in the agentic workflow
# Spec Kit diagnose (speckit-diagnose.md). It also checks amendment pull requests that a person edited.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  command:
    name: Run the command
    # issue_comment always uses this workflow from the default branch; no job checks out pull request code.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/speckit')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level, so comments that are not commands (their job is skipped) never displace a pending command.
    concurrency:
      group: speckit-commands-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The comment reaches the script only through the environment, never through the workflow expression syntax.
      - name: Run the command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.issue.number }}
          SPECKIT_COMMENT_ID: ${{ github.event.comment.id }}
          SPECKIT_ACTOR: ${{ github.event.comment.user.login }}
          SPECKIT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/speckit-commands.mjs command

  amendment:
    name: Check the amendment
    if: >-
      github.event_name == 'pull_request_target' &&
      startsWith(github.event.pull_request.head.ref, 'speckit-amend/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check the amendment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_PULL: ${{ github.event.pull_request.number }}
        run: node .github/scripts/speckit-diagnose.mjs check-amendment
