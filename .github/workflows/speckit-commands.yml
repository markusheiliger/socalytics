name: Spec Kit commands

# Handles people's input on Spec Kit pull requests:
#   - `/speckit <command>` comments on implementation pull requests (speckit/<folder>): diagnose, resume, sync, help.
#   - Feedback on amendment pull requests (speckit-amend/<folder>): a comment, or a review with Comment or Request
#     changes, has the amendment reworked (Spec Kit diagnose, mode revise) and checked again (Spec Kit analyze).
#   - Closing an amendment pull request: merged (the implementation continues) or discarded; a person's push to an
#     amendment branch is checked again.
# Only people with write access are heard; comments and reviews by bots never trigger. Reviews arrive through a small
# forwarder job, because GitHub runs pull_request_review workflows from the pull request's merge ref; it only
# dispatches this workflow on the default branch, where everything else runs.
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [closed, synchronize]
  workflow_dispatch:
    inputs:
      pull:
        description: Amendment pull request whose feedback to handle (set by the review forwarder)
        required: true
        type: string

permissions: {}

jobs:
  command:
    name: Run the command
    # issue_comment always uses this workflow from the default branch; no job checks out pull request code.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/speckit')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level, so comments that are not commands (their job is skipped) never displace a pending command.
    concurrency:
      group: speckit-commands-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The comment reaches the script only through the environment, never through the workflow expression syntax.
      - name: Run the command
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.issue.number }}
          SPECKIT_COMMENT_ID: ${{ github.event.comment.id }}
          SPECKIT_ACTOR: ${{ github.event.comment.user.login }}
          SPECKIT_COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/speckit-commands.mjs command

  feedback:
    name: Handle amendment feedback
    if: >-
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      !startsWith(github.event.comment.body, '/speckit')) ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # Waits up to 20 minutes for a running check or rework before starting the rework.
    timeout-minutes: 30
    concurrency:
      group: speckit-feedback-${{ github.event.issue.number || inputs.pull }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The script ignores pull requests that are not amendments and people without write access.
      - name: Handle the feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.issue.number || inputs.pull }}
          SPECKIT_COMMENT_ID: ${{ github.event.comment.id }}
          SPECKIT_ACTOR: ${{ github.event.comment.user.login }}
        run: node .github/scripts/speckit-amend.mjs feedback

  forward-review:
    name: Forward the review
    # Runs from the pull request's merge ref; it only hands the review to this workflow on the default branch.
    if: >-
      github.event_name == 'pull_request_review' &&
      startsWith(github.event.pull_request.head.ref, 'speckit-amend/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.type != 'Bot' &&
      github.event.review.state != 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the feedback handling on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL: ${{ github.event.pull_request.number }}
        run: gh workflow run speckit-commands.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f pull="$PULL"

  amendment:
    name: Handle the amendment change
    # A person merged or closed an amendment pull request, or pushed to its branch. Pushes and closes by the workflow
    # token raise no events.
    if: >-
      github.event_name == 'pull_request_target' &&
      startsWith(github.event.pull_request.head.ref, 'speckit-amend/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: speckit-feedback-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Handle the change
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_PULL: ${{ github.event.pull_request.number }}
          SPECKIT_ACTOR: ${{ github.event.sender.login }}
          EVENT_ACTION: ${{ github.event.action }}
        run: node .github/scripts/speckit-amend.mjs "$([ "$EVENT_ACTION" = closed ] && echo closed || echo pushed)"
