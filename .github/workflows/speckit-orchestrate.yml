name: Spec Kit orchestrate

# Schedules spec implementations. For spec twins with a validated speckit:stage:implement flag and no open blockers it
# prepares the implementation workspace (linked speckit/<folder> branch, draft pull request, check run) and starts the
# spec's implementation chain (Spec Kit implement), while fewer than SPECKIT_MAX_ACTIVE_SPECS (repository variable,
# default 3) implementations are active. Each chain implements its spec phase by phase, converges, and merges on its
# own; the scheduler never drives tasks. It also:
#   - restarts the chain of an implementation in progress when no run of it is active but there is something to do
#     (the chain broke, a person pushed, or a diagnosis went stale);
#   - finalizes implementations a person merged, and sends twins whose pull request was closed without merging back to
#     their computed stage;
#   - settles amendment pull requests and keeps Spec Kit pull requests out of pull request stacks.
on:
  workflow_run:
    workflows: [Spec Kit prepare]
    types: [completed]
  issues:
    types: [closed, reopened]
  pull_request_target:
    types: [closed, synchronize]
  schedule:
    # Safety net: continues implementations whose chain broke.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      after_run:
        description: Run id that handed control back (set by implementation runs from before the chain; leave empty)
        required: false
        type: string

permissions: {}

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  orchestrate:
    name: Schedule spec implementations
    # pull_request_target always uses this workflow from the default branch; no job checks out pull request code
    # with a write token.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request_target' || (startsWith(github.event.pull_request.head.ref, 'speckit/') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so runs whose job is skipped never displace a pending run; a replaced pending run is harmless because
    # every run recomputes the complete state.
    concurrency:
      group: speckit-orchestrate
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Schedule spec implementations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_AFTER_RUN: ${{ inputs.after_run }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
          SPECKIT_MAX_ACTIVE_SPECS: ${{ vars.SPECKIT_MAX_ACTIVE_SPECS || '3' }}
        run: node .github/scripts/speckit-orchestrate.mjs orchestrate