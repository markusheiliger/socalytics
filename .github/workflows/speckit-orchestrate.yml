name: Spec Kit orchestrate

# Schedules spec implementations. For spec twins requested with `/speckit implement` (speckit:stage:implement) and no open blockers it
# prepares the implementation workspace (linked speckit/<folder> branch, draft pull request, check run), moves the twin
# to speckit:stage:implementing, and starts the
# spec's implementation chain (the Spec Kit implement workflows), while fewer than SPECKIT_MAX_ACTIVE_SPECS (repository variable,
# default 3) implementations are active. Each chain implements its spec phase by phase, converges, and merges on its
# own; the scheduler never drives tasks. It also:
#   - restarts the chain of an implementation in progress when no run of it is active but there is something to do
#     (the chain broke, a person pushed, or a diagnosis went stale);
#   - finalizes implementations a person merged, and sends twins whose pull request was closed without merging back to
#     their computed stage;
#   - settles amendment pull requests and spec pull requests of `/speckit author` and keeps Spec Kit pull requests
#     out of pull request stacks;
#   - links a merged spec of `/speckit author` to the implementation it unblocks (a dependency; the spec starts once
#     someone signs it off with `/speckit implement` on its twin), and retries that implementation once it landed;
#   - starts requested prerequisites of running implementations first, regardless of the limit.
#   - lifts the block of every implementation pull request labelled `blocked` whose fix landed, also when its twin is
#     not in progress.
#   - starts one non-blocking `/speckit author` spec per test that passed only on its rerun (flaky) in at least
#     SPECKIT_FLAKY_THRESHOLD (repository variable, default 3) implementation pull requests, open or merged in the last
#     14 days, on the open one where it was flaky most recently.
#   - starts Spec Kit backlog (speckit-backlog.yml) once no spec is left to request with `/speckit implement`; it
#     authors the next SPECKIT_BACKLOG_SPECS (repository variable, default 5, 0 turns it off) specs like
#     `/speckit-gha-author --repeat` and publishes them on the default branch. One at a time; after a failed refill
#     the next one starts a day later.
# Events caused by the workflow token (an automatic merge, the twin it closes) start no workflows, so the merge and
# every dispatched, applying Spec Kit prepare run dispatch this workflow; that is the main path after a merge. The
# schedule is only a fallback for runs that GitHub drops or delays.
on:
  workflow_run:
    workflows: [Spec Kit prepare]
    types: [completed]
  issues:
    types: [closed, reopened]
  pull_request_target:
    types: [closed, synchronize]
  schedule:
    # Fallback only: continues implementations whose chain broke. Two entries, because GitHub may drop scheduled runs.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

# Every run says what started it, and which pull request or spec twin it reacts to: GitHub would otherwise name it
# after the pull request or issue title alone ("Implement: …", "Amend: …").
run-name: "${{ github.event_name == 'pull_request_target' && format('Spec Kit orchestrate · pull request #{0} {1} · {2}', github.event.pull_request.number, github.event.action, github.event.pull_request.title) || github.event_name == 'issues' && format('Spec Kit orchestrate · #{0} {1} · {2}', github.event.issue.number, github.event.action, github.event.issue.title) || github.event_name == 'workflow_run' && format('Spec Kit orchestrate · after {0}', github.event.workflow_run.name) || github.event_name == 'schedule' && 'Spec Kit orchestrate · scheduled' || 'Spec Kit orchestrate' }}"

permissions: {}

jobs:
  refuse:
    name: Refuse non-default-branch runs
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse the run
        run: |
          echo "::error::Spec Kit workflows only run from the default branch, not ${GITHUB_REF}."
          exit 1

  orchestrate:
    name: Schedule spec implementations
    # pull_request_target always uses this workflow from the default branch; no job checks out pull request code
    # with a write token.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request_target' || (startsWith(github.event.pull_request.head.ref, 'speckit/') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so runs whose job is skipped never displace a pending run; a replaced pending run is harmless because
    # every run recomputes the complete state.
    concurrency:
      group: speckit-orchestrate
      cancel-in-progress: false
    permissions:
      actions: write
      checks: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Schedule spec implementations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_MAX_ACTIVE_SPECS: ${{ vars.SPECKIT_MAX_ACTIVE_SPECS || '3' }}
          # How many unblocked implementations carry the `roadblock` label (those most others wait for); 0 turns it off.
          SPECKIT_ROADBLOCK_PULLS: ${{ vars.SPECKIT_ROADBLOCK_PULLS || '3' }}
          SPECKIT_FLAKY_THRESHOLD: ${{ vars.SPECKIT_FLAKY_THRESHOLD }}
          SPECKIT_BACKLOG_SPECS: ${{ vars.SPECKIT_BACKLOG_SPECS || '5' }}
          # While the latest Main health run failed, new specs wait (prerequisites of running implementations still
          # start); false turns that off.
          SPECKIT_HEALTH_GATE: ${{ vars.SPECKIT_HEALTH_GATE }}
        run: node .github/scripts/speckit-orchestrate.mjs orchestrate