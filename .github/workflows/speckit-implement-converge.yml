name: Spec Kit implement convergence

# One convergence attempt, called by Spec Kit implement spec after every planned task is complete. The read-only work
# job checks the implementation against the spec and packages its proposed tasks.md change. The write-capable land job
# re-validates, commits, pushes, and reports it without running agent-written code.
on:
  workflow_call:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      folder:
        description: Spec folder name under specs/
        required: true
        type: string
      base:
        description: Base branch of the implementation pull request
        required: true
        type: string
      order:
        description: The single convergence attempt as a task-order JSON value
        required: true
        type: string
    outputs:
      ok:
        description: Whether the convergence landed
        value: ${{ jobs.land.outputs.ok }}
      head:
        description: Head of the implementation branch after convergence
        value: ${{ jobs.land.outputs.head }}

permissions: {}

jobs:
  work:
    name: Check the implementation against the spec
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.order)[0] }}
    permissions:
      contents: read
      copilot-requests: write
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ matrix.attempt }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Record the start commit
        run: echo "SPECKIT_HEAD=$(git -C workspace rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Python for the Spec Kit scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Locate the spec folder
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          if [ -d "workspace/specs/$FOLDER" ]; then dir="specs/$FOLDER"; else dir="specs/archive/$FOLDER"; fi
          echo "SPECIFY_FEATURE_DIRECTORY=$dir" >> "$GITHUB_ENV"

      - name: Run Copilot CLI
        uses: ./tooling/.github/actions/speckit-copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          level: strong
          mode: agent
          prompt: ${{ matrix.prompt }}
          ai-credits: ${{ vars.SPECKIT_TASK_AI_CREDITS || '1000' }}
          working-directory: workspace
          output-format: json
          output-file: ${{ env.SPECKIT_RESULT_DIR }}/agent.jsonl
          exit-code-file: ${{ env.SPECKIT_RESULT_DIR }}/agent-exit.txt

      - name: Package the result
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-converge.mjs" package

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-result-converge
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  land:
    name: Commit and push the convergence
    needs: work
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    outputs:
      ok: ${{ steps.land.outputs.ok }}
      head: ${{ steps.land.outputs.head }}
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_ORDER: ${{ inputs.order }}
      SPECKIT_ORDER_INDEX: 0
      SPECKIT_WORK_RESULT: ${{ needs.work.result }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_ROOT: ${{ github.workspace }}/results
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the work result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-result-converge
          path: ${{ github.workspace }}/results

      - name: Commit, push, and report the convergence
        id: land
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/.github/scripts/speckit-converge.mjs land-tasks
