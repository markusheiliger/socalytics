name: Tooling tests

# Runs the Node tests of the repository tooling (the Spec Kit scripts and the environment actions) whenever the tooling
# or a component's verification declaration changes, on any branch and in pull requests, so a broken workflow script
# or action shows within minutes instead of in the next implementation that uses it. Read-only; it runs no agent.
on:
  push:
    paths:
      - ".github/**"
      - "src/**/verification.json"
  pull_request:
    paths:
      - ".github/**"
      - "src/**/verification.json"
  workflow_dispatch:

run-name: "${{ github.event_name == 'pull_request' && format('Tooling tests · pull request #{0}', github.event.pull_request.number) || format('Tooling tests · {0}', github.ref_name) }}"

permissions:
  contents: read

concurrency:
  group: tooling-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test the tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The Analyst project helper tests run `python` and `python3`.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The pins equal the Markdown linters of environment-setup, which the Markdown check tests use.
      - name: Install the Markdown linters
        run: npm install --global markdownlint-cli2@0.23.3 markdown-link-check@3.15.0

      - name: Give Git an identity for the tests' own repositories
        run: |
          git config --global user.name "tooling-tests"
          git config --global user.email "tooling-tests@users.noreply.github.com"

      - name: Run the tooling tests
        run: node --test .github/scripts/*.test.mjs .github/actions/environment-verify/*.test.mjs .github/actions/environment-setup/*.test.mjs
