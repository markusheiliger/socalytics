name: Spec Kit implement conflict resolution

# One conflict-resolution attempt, called by Spec Kit implement spec. The read-only work job merges the base branch,
# lets Copilot edit conflicted files (and the implementation's own files, or minimally base-branch files the merged
# result needs, for clashes without a textual conflict) when
# necessary, and runs final verification. The write-capable land job
# replays and validates the resolution, records changes to base-branch files (which hold the final merge for review),
# commits, pushes, and reports it without running agent-written code.
on:
  workflow_call:
    inputs:
      twin:
        description: Spec twin issue number
        required: true
        type: string
      pull:
        description: Implementation pull request number
        required: true
        type: string
      folder:
        description: Spec folder name under specs/
        required: true
        type: string
      base:
        description: Base branch of the implementation pull request
        required: true
        type: string
      order:
        description: The single conflict-resolution attempt as a task-order JSON value
        required: true
        type: string
    outputs:
      ok:
        description: Whether the resolution landed
        value: ${{ jobs.land.outputs.ok }}
      head:
        description: Head of the implementation branch after resolution
        value: ${{ jobs.land.outputs.head }}

permissions: {}

jobs:
  work:
    name: Resolve conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.order)[0] }}
    permissions:
      contents: read
      copilot-requests: write
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_ATTEMPT: ${{ matrix.attempt }}
      SPECKIT_GUIDANCE: ${{ matrix.guidance }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_RESULT_DIR: ${{ github.workspace }}/speckit-result
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Record the start commit
        run: echo "SPECKIT_HEAD=$(git -C workspace rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up the solution environment
        if: hashFiles('tooling/.github/actions/environment-setup/action.yml') != ''
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Merge the base branch
        id: integrate
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-resolve.mjs" integrate

      - name: Locate the spec folder
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          if [ -d "workspace/specs/$FOLDER" ]; then dir="specs/$FOLDER"; else dir="specs/archive/$FOLDER"; fi
          echo "SPECIFY_FEATURE_DIRECTORY=$dir" >> "$GITHUB_ENV"

      - name: Resolve the conflicts with Copilot CLI
        if: steps.integrate.outputs.agent == 'true'
        uses: ./tooling/.github/actions/speckit-copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        with:
          level: standard
          mode: agent
          deny-tools: |
            shell(git merge:*)
            shell(git checkout:*)
            shell(git reset:*)
            shell(git restore:*)
            shell(git stash:*)
            shell(git rebase:*)
          prompt: ${{ steps.integrate.outputs.prompt }}
          ai-credits: ${{ vars.SPECKIT_TASK_AI_CREDITS || '1000' }}
          working-directory: workspace
          output-format: json
          output-file: ${{ env.SPECKIT_RESULT_DIR }}/agent.jsonl
          exit-code-file: ${{ env.SPECKIT_RESULT_DIR }}/agent-exit.txt

      - name: Package the result
        id: package
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-resolve.mjs" package

      - name: Verify the resolution
        id: verify
        if: >-
          steps.package.outputs.verify == 'true' &&
          hashFiles('tooling/.github/actions/environment-verify/action.yml') != ''
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-verify
        with:
          workspace: ${{ env.SPECKIT_WORKSPACE }}
          mode: finalize
          changed-files: ${{ env.SPECKIT_RESULT_DIR }}/changed-files.txt
          log-file: ${{ env.SPECKIT_RESULT_DIR }}/verification.log

      - name: Record the verdict
        env:
          SPECKIT_VERIFY_CONFIGURED: ${{ hashFiles('tooling/.github/actions/environment-verify/action.yml') != '' }}
          SPECKIT_VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SPECKIT_VERIFY_CHECKS: ${{ steps.verify.outputs.checks }}
          SPECKIT_VERIFY_UNCOVERED: ${{ steps.verify.outputs.uncovered }}
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-resolve.mjs" verdict

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speckit-result-resolve
          path: ${{ github.workspace }}/speckit-result
          retention-days: 7
          if-no-files-found: ignore

  land:
    name: Commit and push the conflict resolution
    needs: work
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: write
      issues: read
      pull-requests: write
    outputs:
      ok: ${{ steps.land.outputs.ok }}
      head: ${{ steps.land.outputs.head }}
    env:
      SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SPECKIT_BASE_BRANCH: ${{ inputs.base }}
      SPECKIT_TWIN: ${{ inputs.twin }}
      SPECKIT_PULL: ${{ inputs.pull }}
      SPECKIT_FOLDER: ${{ inputs.folder }}
      SPECKIT_ORDER: ${{ inputs.order }}
      SPECKIT_ORDER_INDEX: 0
      SPECKIT_WORK_RESULT: ${{ needs.work.result }}
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_RESULT_ROOT: ${{ github.workspace }}/results
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false

      - name: Check out the implementation branch
        uses: actions/checkout@v5
        with:
          ref: speckit/${{ inputs.folder }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the work result
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: speckit-result-resolve
          path: ${{ github.workspace }}/results

      - name: Commit, push, and report the resolution
        id: land
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_AUTO_DIAGNOSE: ${{ vars.SPECKIT_AUTO_DIAGNOSE || 'true' }}
        run: node tooling/.github/scripts/speckit-resolve.mjs land-tasks
