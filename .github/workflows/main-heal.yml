name: Main heal

# Heals an unhealthy default branch (speckit-heal.mjs). Main health starts it when the full verification of the default
# branch fails; it also runs on demand. A Copilot agent fixes the cause in a read-only job from the evidence of the
# failing Main health run, a job that never runs agent-written code commits the change to a healing branch
# (`main-heal/<issue>-<attempt>`) and opens a draft healing pull request, the change is verified in full like the
# default branch, and a passed healing pull request is handed to a person to review and merge; a failed attempt is
# closed and the next one starts (at most three per health issue). It never merges. While the health issue or a
# healing pull request is open, the Spec Kit scheduler blocks every implementation and starts no spec.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: The open health issue (informational; the healer always works on the open one)
        required: false
        default: ""
      run:
        description: The failing Main health run whose evidence to use (default the latest failed one)
        required: false
        default: ""

run-name: "${{ inputs.issue && format('Main heal · fix the unhealthy default branch (#{0})', inputs.issue) || 'Main heal · fix the unhealthy default branch' }}"

permissions: {}

# One healing attempt at a time.
concurrency:
  group: main-heal
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to heal
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      issue: ${{ steps.decide.outputs.issue }}
      attempt: ${{ steps.decide.outputs.attempt }}
      branch: ${{ steps.decide.outputs.branch }}
      previous: ${{ steps.decide.outputs.previous }}
      run: ${{ steps.decide.outputs.run }}
      cause: ${{ steps.decide.outputs.cause }}
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_HEAL_RUN: ${{ inputs.run }}
        run: node .github/scripts/speckit-heal.mjs decide

  work:
    name: Heal the default branch
    needs: decide
    if: needs.decide.outputs.action == 'heal'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read-only: the agent's change leaves this job only as a patch, which the land job validates.
    permissions:
      contents: read
      actions: read
      copilot-requests: write
    env:
      SPECKIT_TOOLING: ${{ github.workspace }}/tooling
      SPECKIT_WORKSPACE: ${{ github.workspace }}/workspace
      SPECKIT_HEAL_ISSUE: ${{ needs.decide.outputs.issue }}
      SPECKIT_HEAL_ATTEMPT: ${{ needs.decide.outputs.attempt }}
      SPECKIT_HEAL_PREVIOUS: ${{ needs.decide.outputs.previous }}
      SPECKIT_HEAL_CAUSE: ${{ needs.decide.outputs.cause }}
      SPECKIT_HEAL_EVIDENCE: .speckit-heal-evidence
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Prepare the workspace
        working-directory: workspace
        run: |
          mkdir -p "$SPECKIT_HEAL_EVIDENCE"
          printf '%s/\n' "$SPECKIT_HEAL_EVIDENCE" >> .git/info/exclude
          git rev-parse HEAD > "$RUNNER_TEMP/base.txt"

      - name: Download the evidence of the failing run
        if: needs.decide.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: main-health
          run-id: ${{ needs.decide.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/workspace/.speckit-heal-evidence

      # The changes since the last green verification, so the agent starts from what made the default branch red.
      - name: Write the changes that made it red
        working-directory: workspace
        run: |
          range="$(node -e 'const c = JSON.parse(process.env.SPECKIT_HEAL_CAUSE || "null"); process.stdout.write(c && c.green && c.red && c.green !== c.red ? c.green + " " + c.red : "")')"
          if [ -n "$range" ]; then
            set -- $range
            git log --first-parent --format='%H %s' "$1..$2" > "$SPECKIT_HEAL_EVIDENCE/cause.log" || true
            git diff "$1" "$2" > "$SPECKIT_HEAL_EVIDENCE/cause.diff" || true
            wc -c "$SPECKIT_HEAL_EVIDENCE/cause.diff"
          fi

      - name: Set up the solution environment
        continue-on-error: true
        uses: ./tooling/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Write the prompt
        env:
          SPECKIT_HEAL_PROMPT_FILE: ${{ runner.temp }}/heal-prompt.md
        run: node "$SPECKIT_TOOLING/.github/scripts/speckit-heal.mjs" prompt

      - name: Let the agent heal the default branch
        uses: ./tooling/.github/actions/speckit-copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          # Full end-to-end runs take longer than the CLI's default ten-minute wait for background commands.
          COPILOT_TASK_WAIT_TIMEOUT_SECONDS: "2400"
        with:
          level: strong
          mode: agent
          ai-credits: ${{ vars.SPECKIT_HEAL_AI_CREDITS || '2000' }}
          timeout: 90m
          working-directory: workspace
          prompt-file: ${{ runner.temp }}/heal-prompt.md
          output-file: ${{ runner.temp }}/heal-result/agent.txt
          exit-code-file: ${{ runner.temp }}/heal-result/agent-exit.txt

      - name: Package the change
        if: always()
        working-directory: workspace
        run: |
          result="$RUNNER_TEMP/heal-result"
          mkdir -p "$result"
          cp "$RUNNER_TEMP/base.txt" "$result/base.txt"
          if [ -f "$SPECKIT_HEAL_EVIDENCE/summary.md" ]; then cp "$SPECKIT_HEAL_EVIDENCE/summary.md" "$result/summary.md"; fi
          git add -A
          git diff --cached --binary > "$result/patch.diff"
          git diff --cached --name-status > "$result/changes.txt"
          echo "Changed files:"; cat "$result/changes.txt"

      - name: Upload the change
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-heal-result
          path: ${{ runner.temp }}/heal-result
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore

  land:
    name: Open the healing pull request
    needs: [decide, work]
    if: ${{ always() && needs.decide.outputs.action == 'heal' && needs.work.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never runs agent-written code: it validates the patch, applies it with git, and pushes the healing branch.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
      actions: write
    outputs:
      landed: ${{ steps.land.outputs.landed }}
      pull: ${{ steps.land.outputs.pull }}
      head: ${{ steps.land.outputs.head }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the change
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: main-heal-result
          path: ${{ runner.temp }}/heal-result

      # The tooling runs from a copy, so checking out the healing branch cannot change it.
      - name: Copy the trusted tooling
        run: cp -r .github/scripts "$RUNNER_TEMP/tooling-scripts"

      - name: Land the change
        id: land
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_HEAL_ISSUE: ${{ needs.decide.outputs.issue }}
          SPECKIT_HEAL_ATTEMPT: ${{ needs.decide.outputs.attempt }}
          SPECKIT_HEAL_BRANCH: ${{ needs.decide.outputs.branch }}
          SPECKIT_HEAL_EVIDENCE_URL: ${{ needs.decide.outputs.run != '' && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, needs.decide.outputs.run) || '' }}
        run: node "$RUNNER_TEMP/tooling-scripts/speckit-heal.mjs" land "$RUNNER_TEMP/heal-result"

  shards:
    name: Plan the verification shards
    needs: land
    if: needs.land.outputs.landed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the healing branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.land.outputs.head }}
          path: workspace
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Plan the shards
        id: plan
        run: |
          : > "$RUNNER_TEMP/changed-files.txt"
          matrix="$(node tooling/.github/actions/environment-verify/verification-plan.mjs --root workspace --mode finalize --changed-files "$RUNNER_TEMP/changed-files.txt" --matrix 4)"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify the healing pull request
    needs: [land, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Check out the healing branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.land.outputs.head }}
          path: workspace
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Write the empty change list
        run: |
          mkdir -p "$RUNNER_TEMP/main-heal"
          : > "$RUNNER_TEMP/no-changes.txt"

      # The healing change may fix the environment actions themselves, so they are loaded from the healing branch.
      - name: Set up the solution environment
        uses: ./workspace/.github/actions/environment-setup
        with:
          workspace: workspace

      - name: Verify the shard
        id: verify
        uses: ./workspace/.github/actions/environment-verify
        with:
          workspace: workspace
          mode: finalize
          changed-files: ${{ runner.temp }}/no-changes.txt
          log-file: ${{ runner.temp }}/main-heal/verification.log
          shard: ${{ matrix.shard }}

      - name: Record the shard outcome
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          OUTCOME: ${{ steps.verify.outcome }}
          CHECKS: ${{ steps.verify.outputs.checks }}
          FLAKY: ${{ steps.verify.outputs.flaky }}
        run: |
          mkdir -p "$RUNNER_TEMP/main-heal"
          printf '%s\n' "$SHARD" > "$RUNNER_TEMP/main-heal/shard.txt"
          printf '%s\n' "$OUTCOME" > "$RUNNER_TEMP/main-heal/outcome.txt"
          printf '%s\n' "$CHECKS" > "$RUNNER_TEMP/main-heal/checks.txt"
          printf '%s\n' "$FLAKY" > "$RUNNER_TEMP/main-heal/flaky.txt"

      - name: Upload the shard verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-heal-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/main-heal
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Record the healing verification
    needs: [decide, land, shards, verify]
    if: ${{ always() && needs.land.outputs.landed == 'true' && needs.shards.result != 'cancelled' && needs.verify.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
      actions: write
    steps:
      - name: Check out the trusted tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the shard verifications
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: main-heal-shard-*
          path: ${{ runner.temp }}/shards

      - name: Combine the shard verifications
        id: combine
        run: node .github/scripts/speckit-verify-shards.mjs combine "$RUNNER_TEMP/shards" "$RUNNER_TEMP/main-heal"

      - name: Upload the combined verification
        if: steps.combine.outputs.shards != '0'
        uses: actions/upload-artifact@v7
        with:
          name: main-heal-verification
          path: ${{ runner.temp }}/main-heal
          retention-days: 14
          if-no-files-found: ignore

      - name: Record the verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_HEAL_ISSUE: ${{ needs.decide.outputs.issue }}
          SPECKIT_HEAL_ATTEMPT: ${{ needs.decide.outputs.attempt }}
          SPECKIT_HEAL_PULL: ${{ needs.land.outputs.pull }}
          SPECKIT_HEAL_RESULT: ${{ needs.shards.result == 'success' && needs.verify.result || needs.shards.result }}
          SPECKIT_HEAL_LOG: ${{ runner.temp }}/main-heal/verification.log
          SPECKIT_HEAL_REVIEWER: ${{ vars.SPECKIT_HEAL_REVIEWER || github.repository_owner }}
        run: node .github/scripts/speckit-heal.mjs report
