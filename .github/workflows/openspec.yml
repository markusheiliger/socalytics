name: openspec

run-name: >-
  ${{
    github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'openspec:enqueued'
      && format('openspec · enqueued #{0} by @{1}', github.event.issue.number, github.actor)
    || github.event_name == 'issues'
      && format('openspec · issue #{0} {1} by @{2}', github.event.issue.number, github.event.action, github.actor)
    || github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged
      && format('openspec · PR #{0} merged', github.event.pull_request.number)
    || github.event_name == 'pull_request_target' && github.event.action == 'closed'
      && format('openspec · PR #{0} closed', github.event.pull_request.number)
    || github.event_name == 'pull_request_target'
      && format('openspec · new commits on {0}', github.event.pull_request.head.ref)
    || github.event_name == 'issue_comment'
      && format('openspec · command on #{0} by @{1}', github.event.issue.number, github.actor)
    || github.event_name == 'push' && 'openspec · OpenSpec changes updated on main'
    || github.event_name == 'schedule' && 'openspec · watchdog'
    || inputs.dry_run && 'openspec · manual (dry run)'
    || 'openspec · manual run'
  }}

on:
  issues:
    types: [labeled, unlabeled, closed, reopened]
  pull_request_target:
    types: [synchronize, closed]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - "openspec/changes/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what the workflow would do"
        required: false
        default: false
        type: boolean

permissions: {}

# Relevant events share one lock and each run reconciles every change, so a
# replaced pending run loses nothing. Irrelevant events get their own group so
# they can never replace a pending relevant run.
concurrency:
  group: >-
    ${{
      (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'openspec:change'))
      && (github.event_name != 'pull_request_target' || startsWith(github.event.pull_request.head.ref, 'openspec/'))
      && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/openspec')))
      && 'openspec'
      || format('openspec-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  observe:
    name: Read current state
    if: >-
      ${{
        (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'openspec:change'))
        && (github.event_name != 'pull_request_target' || startsWith(github.event.pull_request.head.ref, 'openspec/'))
        && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/openspec')))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openspec
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    outputs:
      relevant: ${{ steps.observe.outputs.relevant }}
      credit: ${{ steps.observe.outputs.credit }}
      touched: ${{ steps.observe.outputs.touched }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Read state, apply commands, and find finished sessions
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          OPENSPEC_DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/openspec-change-orchestrator.mjs observe

  credit:
    name: Check agent result
    needs: observe
    if: ${{ needs.observe.outputs.relevant == 'true' && needs.observe.outputs.credit != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: openspec
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.observe.outputs.credit) }}
    steps:
      - name: Check out trusted controller with full history
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install the OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.13.0

      - name: Validate the checkpoint and record the result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs credit --change "$CHANGE"

  plan:
    name: Decide next steps
    needs: [observe, credit]
    if: ${{ always() && needs.observe.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    outputs:
      admit: ${{ steps.plan.outputs.admit }}
      apply: ${{ steps.plan.outputs.apply }}
      verify: ${{ steps.plan.outputs.verify }}
      sync: ${{ steps.plan.outputs.sync }}
      archive: ${{ steps.plan.outputs.archive }}
      gate: ${{ steps.plan.outputs.gate }}
      finalize: ${{ steps.plan.outputs.finalize }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Decide the next step for every change
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENSPEC_DRY_RUN: ${{ inputs.dry_run }}
          OPENSPEC_MAX_ACTIVE_CHANGES: ${{ vars.OPENSPEC_MAX_ACTIVE_CHANGES }}
        run: node .github/scripts/openspec-change-orchestrator.mjs plan

  admit:
    name: Start change
    needs: plan
    if: ${{ needs.plan.outputs.admit != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openspec
    permissions:
      contents: write
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.admit) }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Create the branch and draft pull request, then start the first task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs admit --change "$CHANGE"

  apply:
    name: Apply next task
    needs: plan
    if: ${{ needs.plan.outputs.apply != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openspec
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.apply) }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start a Copilot agent session for the next task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs dispatch --operation apply --change "$CHANGE"

  verify:
    name: Verify change
    needs: plan
    if: ${{ needs.plan.outputs.verify != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openspec
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.verify) }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start a Copilot agent session to verify the change
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs dispatch --operation verify --change "$CHANGE"

  sync:
    name: Sync specs
    needs: plan
    if: ${{ needs.plan.outputs.sync != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openspec
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.sync) }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start a Copilot agent session to sync specs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs dispatch --operation sync --change "$CHANGE"

  archive:
    name: Archive change
    needs: plan
    if: ${{ needs.plan.outputs.archive != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openspec
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.archive) }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Start a Copilot agent session to archive the change
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs dispatch --operation archive --change "$CHANGE"

  gate:
    name: Ask for human input
    needs: plan
    if: ${{ needs.plan.outputs.gate != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.gate) }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Post the question and notify the requester
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs gate --change "$CHANGE"

  finalize:
    name: Finish change
    needs: plan
    if: ${{ needs.plan.outputs.finalize != '[]' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.finalize) }}
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Record the merge, close, or abort
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGE: ${{ matrix.change }}
        run: node .github/scripts/openspec-change-orchestrator.mjs finalize --change "$CHANGE"

  publish:
    name: Update PR and issue status
    needs: [observe, plan, admit, apply, verify, sync, archive, gate, finalize]
    if: ${{ always() && needs.plan.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh overview comments and labels of changed pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENSPEC_TOUCHED: >-
            ${{ format('[{0},{1},{2},{3},{4},{5},{6},{7}]',
              needs.observe.outputs.touched || '[]',
              needs.observe.outputs.credit || '[]',
              needs.plan.outputs.admit,
              needs.plan.outputs.apply,
              needs.plan.outputs.verify,
              needs.plan.outputs.sync,
              needs.plan.outputs.archive,
              needs.plan.outputs.gate) }}
        run: node .github/scripts/openspec-change-orchestrator.mjs publish
