name: Main health

# Verifies the default branch in full, so a broken default branch shows at once instead of when some implementation's
# verification trips over it: after every push to the default branch that changes more than Markdown and specs/, every
# night (changes outside the repository: SDK patches, runner images, downloads), and on demand. It plans the
# verification shards like Spec Kit implement verify, runs environment-verify in finalize mode in each, and records the
# result (speckit-main-health.mjs): a failure opens or updates one tracking issue (label `main-health`) and starts the
# healer (Main heal, main-heal.yml), a success closes it and starts the Spec Kit scheduler. While the issue or a healing
# pull request is open, the scheduler blocks every implementation and starts no spec (repository variable
# SPECKIT_HEALTH_GATE=false turns that off).
on:
  push:
    # The job runs on the default branch only; Spec Kit's own branches are left out so they start no skipped runs.
    branches-ignore:
      - "speckit/**"
      - "speckit-amend/**"
      - "speckit-spec/**"
      - "speckit-fix/**"
      - "main-heal/**"
    paths-ignore:
      - "**/*.md"
      - "specs/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

run-name: "${{ github.event_name == 'push' && format('Main health · check {0} after a push', github.ref_name) || github.event_name == 'schedule' && format('Main health · nightly check of {0}', github.ref_name) || format('Main health · check {0}', github.ref_name) }}"

permissions: {}

# One run at a time per branch; GitHub keeps only the newest pending run, so the latest state is always verified next.
concurrency:
  group: main-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shards:
    name: Plan the verification shards
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # An empty change list verifies everything (finalize mode never treats it as documentation-only).
      - name: Plan the shards
        id: plan
        run: |
          : > "$RUNNER_TEMP/changed-files.txt"
          matrix="$(node .github/actions/environment-verify/verification-plan.mjs --root . --mode finalize --changed-files "$RUNNER_TEMP/changed-files.txt" --matrix 4)"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify the default branch
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Write the empty change list
        run: |
          mkdir -p "$RUNNER_TEMP/main-health"
          : > "$RUNNER_TEMP/no-changes.txt"

      - name: Set up the solution environment
        uses: ./.github/actions/environment-setup
        with:
          workspace: .

      - name: Verify the shard
        id: verify
        uses: ./.github/actions/environment-verify
        with:
          workspace: .
          mode: finalize
          changed-files: ${{ runner.temp }}/no-changes.txt
          log-file: ${{ runner.temp }}/main-health/verification.log
          shard: ${{ matrix.shard }}

      - name: Record the shard outcome
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          OUTCOME: ${{ steps.verify.outcome }}
          CHECKS: ${{ steps.verify.outputs.checks }}
          FLAKY: ${{ steps.verify.outputs.flaky }}
        run: |
          mkdir -p "$RUNNER_TEMP/main-health"
          printf '%s\n' "$SHARD" > "$RUNNER_TEMP/main-health/shard.txt"
          printf '%s\n' "$OUTCOME" > "$RUNNER_TEMP/main-health/outcome.txt"
          printf '%s\n' "$CHECKS" > "$RUNNER_TEMP/main-health/checks.txt"
          printf '%s\n' "$FLAKY" > "$RUNNER_TEMP/main-health/flaky.txt"

      - name: Upload the shard verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-health-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/main-health
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Record the health of the default branch
    needs: [shards, verify]
    if: ${{ always() && needs.shards.result != 'skipped' && needs.shards.result != 'cancelled' && needs.verify.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      # The full history attributes a red default branch to the changes since the last green run.
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the shard verifications
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: main-health-shard-*
          path: ${{ runner.temp }}/shards

      - name: Combine the shard verifications
        id: combine
        run: node .github/scripts/speckit-verify-shards.mjs combine "$RUNNER_TEMP/shards" "$RUNNER_TEMP/main-health"

      - name: Upload the combined verification
        if: steps.combine.outputs.shards != '0'
        uses: actions/upload-artifact@v7
        with:
          name: main-health
          path: ${{ runner.temp }}/main-health
          retention-days: 14
          if-no-files-found: ignore

      - name: Record the health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPECKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SPECKIT_HEALTH_RESULT: ${{ needs.shards.result == 'success' && needs.verify.result || needs.shards.result }}
          SPECKIT_HEALTH_LOG: ${{ runner.temp }}/main-health/verification.log
        run: node .github/scripts/speckit-main-health.mjs record

      - name: Fail when the default branch is unhealthy
        if: needs.shards.result != 'success' || needs.verify.result != 'success'
        run: |
          echo "::error::The full verification of the default branch failed."
          exit 1
