name: Run .NET tests
description: >-
  Runs `dotnet test` for one solution or project and writes log.txt (the full output) and
  verification.txt (a short pass summary, or the condensed failures) to the results directory.
  Fails when the tests fail. Generic: it knows nothing about the repository it runs in.
inputs:
  project:
    description: Solution or project to test, relative to working-directory
    required: true
  working-directory:
    description: Directory to run dotnet test in
    required: false
    default: .
  filter:
    description: Optional dotnet test --filter expression
    required: false
    default: ""
  blame-hang-timeout:
    description: Collect a hang dump and abort a test that runs longer than this
    required: false
    default: 10m
  results:
    description: Directory for log.txt and verification.txt
    required: true
runs:
  using: composite
  steps:
    - name: Run dotnet test
      id: test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROJECT: ${{ inputs.project }}
        FILTER: ${{ inputs.filter }}
        HANG_TIMEOUT: ${{ inputs.blame-hang-timeout }}
        RESULTS: ${{ inputs.results }}
      run: |
        mkdir -p "$RESULTS"
        args=(test "$PROJECT" --nologo --blame-hang-timeout "$HANG_TIMEOUT")
        if [[ -n "$FILTER" ]]; then args+=(--filter "$FILTER"); fi
        set -o pipefail
        dotnet "${args[@]}" 2>&1 | tee "$RESULTS/log.txt"

    - name: Summarize passing tests
      if: ${{ success() }}
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: |
        {
          echo "All tests passed."
          grep -E '^\s*Passed!' "$RESULTS/log.txt" | sed -E 's/^\s+//' || true
        } > "$RESULTS/verification.txt"

    - name: Summarize failing tests
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: node "$GITHUB_ACTION_PATH/summarize.mjs" "$RESULTS/log.txt" "$RESULTS/verification.txt"
