name: Run the repository verification
description: >-
  Repository-specific checkpoint verification: skips checkpoints that do not change src/platform/,
  sets up the repository toolchain, runs the platform tests with Testcontainers, and writes
  verification.txt (feedback, most important lines first) and log.txt to the output directory.
  Fails when the tests fail. The commands live in verify.sh, which the agent's run_verification
  tool runs too.
inputs:
  path:
    description: Directory with the checked-out code to verify
    required: false
    default: .
  sha:
    description: Checkpoint commit, for deciding what changed
    required: false
    default: ""
  baseline:
    description: Commit before the operation started; empty verifies unconditionally
    required: false
    default: ""
  output:
    description: Directory for verification.txt and log.txt
    required: true
outputs:
  relevant:
    description: Whether the checkpoint needed verification
    value: ${{ steps.scope.outputs.relevant }}
runs:
  using: composite
  steps:
    - name: Decide whether the checkpoint needs verification
      id: scope
      shell: bash
      env:
        VERIFY_SOURCE: ${{ inputs.path }}
        VERIFY_OUTPUT: ${{ inputs.output }}
        VERIFY_BASELINE: ${{ inputs.baseline }}
        VERIFY_SHA: ${{ inputs.sha }}
      run: bash "$GITHUB_ACTION_PATH/verify.sh" scope

    - name: Set up the repository toolchain
      if: ${{ steps.scope.outputs.relevant == 'true' }}
      uses: ./.github/actions/setup-toolchain
      with:
        global-json-file: ${{ inputs.path }}/src/platform/global.json

    - name: Run the platform tests with Testcontainers
      if: ${{ steps.scope.outputs.relevant == 'true' }}
      shell: bash
      env:
        VERIFY_SOURCE: ${{ inputs.path }}
        VERIFY_OUTPUT: ${{ inputs.output }}
      run: bash "$GITHUB_ACTION_PATH/verify.sh" test
