name: Set up the repository toolchain
description: >-
  Repository-specific build and test toolchain: the .NET SDK pinned by the platform global.json and
  Node.js for the repository's own scripts. Used by the verification workflow and the OpenSpec
  agent's repository import.
inputs:
  global-json-file:
    description: Path to the platform global.json that pins the .NET SDK
    required: false
    default: src/platform/global.json
runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ${{ inputs.global-json-file }}

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
