name: Environment verify
description: >-
  Verifies a change to this solution. Optional extension point of the Spec Kit workflows, which run it after the
  agent implemented a task (mode task: only the checks the changed files call for, each building its solution but
  running only the always-run test projects and the tests the task touched; mode phase, after the last task of a phase:
  those checks with all their tests), after a conflict resolution, and before merging (mode finalize: every check
  with all tests); the workflows skip it when this file does not exist. It runs in a job
  with a read-only token and no token environment variables, because the checks execute agent-written code. The step
  fails when a check fails. Checks, in order: "platform build and tests" covers src/platform/ and the repository-root
  contracts/ folder and is active only while src/platform/SocAlytics.Platform.slnx exists; "Analyst Manager build and
  tests" runs when src/analysts/manager/ or contracts/analyst-manager/ (the Manager's shared golden fixtures) changed
  or in finalize mode, covers only src/analysts/manager/ (contract files stay covered by the platform scope), is
  active only while src/analysts/manager/SocAlytics.Analysts.Manager.slnx exists, and fails when its global.json sdk
  object differs from the platform's; other paths under src/analysts/ stay uncovered; "Web UI build and tests" runs
  when src/clients/web/ or src/platform/SocAlytics.Platform.Api/ changed or in finalize mode (the full Web UI tests
  run in every mode), covers only src/clients/web/ (API files stay covered by the platform scope), is active only
  while src/clients/web/package.json exists, and runs the steps install (npm ci without a browser download),
  playwright pin (the installed @playwright/test must be 1.63.0, the version environment-setup installs), build,
  unit tests, and browser tests through the npm scripts build, test, and test:e2e (with --retries=1), stopping at the
  first failure; other paths under src/clients/ stay uncovered; "Analyst Python projects" runs the locked stages for
  the Analyst Python projects (src/analysts/sdk, src/analysts/capabilities/<name>) the changes select; "Agent Python
  projects" does the same for src/agents/<name> projects with the same convention and stages, runs when an agent
  project, a folder directly under contracts/ named agent-*, contracts/common/, or an environment action folder
  changed or in finalize mode, covers only the roots of existing valid agent projects (src/agents/pyproject.toml,
  nested manifests, and unowned or deleted agent paths stay uncovered), and fails in every mode while an existing
  agent project is invalid; agent projects never depend on Analyst projects or repeat their names; "Environment
  action tests" runs the Node test files of environment-setup and environment-verify when either action folder
  changed or in finalize mode; "Markdown check" follows. Every .NET test project runs with a TRX log; when it fails
  with at most 10 failed tests, only those run once more, and a project whose rerun passes passes. Tests that passed
  only on their rerun (and Playwright's flaky tests) are listed in the log, the step summary, and the flaky output.
# Extending: specs change this action, together with environment-setup, only in a standalone environment spec, which
# is reviewed and merged before the specs that need it start. For a new framework or source area, add one block below
# that (1) adds its scope to COVERED only when its project exists, (2) runs only when the scope changed or in finalize
# mode, (3) skips while its project does not exist yet, because the environment spec merges before the project is
# created, and (4) runs its tests through run_tests, so mode task runs only the tests the change touched. Current
# coverage: the platform scope (src/platform/ and contracts/) is covered while the platform solution
# exists; the Analyst Manager scope (src/analysts/manager/) is covered while the Manager solution exists, and its
# check also runs for contracts/analyst-manager/ changes without covering those files; the Web UI scope
# (src/clients/web/) is covered while src/clients/web/package.json exists, and its check also runs for
# src/platform/SocAlytics.Platform.Api/ changes without covering those files. The agent Python project scope (each
# existing valid src/agents/<name> root) is covered by the check "Agent Python projects", which also runs for
# contracts/agent-*, contracts/common/, finalize, and environment action changes without covering those contract
# files; src/agents/README.md stays covered only by the Markdown rule.
inputs:
  workspace:
    description: Path of the code to verify
    required: true
  mode:
    description: >-
      task: the checks that apply to the changed files, with only the tests the change touched; phase: those checks with
      all their tests; finalize: every check with all tests
    required: true
  changed-files:
    description: Path of a file that lists the changed paths, one per line; it also decides which files no check covers
    required: false
    default: ""
  log-file:
    description: Path of a file that receives the combined output of the checks
    required: true
outputs:
  checks:
    description: Comma-separated names of the checks that ran, in order; after a failure the last one failed
    value: ${{ steps.verify.outputs.checks }}
  uncovered:
    description: Comma-separated changed files that no check covers; the workflows hold such changes for review
    value: ${{ steps.verify.outputs.uncovered }}
  flaky:
    description: >-
      Comma-separated, deduplicated tests that failed and then passed on their one rerun (fully qualified .NET test
      names, Playwright test lines); commas inside a name become semicolons
    value: ${{ steps.verify.outputs.flaky }}
runs:
  using: composite
  steps:
    - name: Run the checks
      id: verify
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
        MODE: ${{ inputs.mode }}
        CHANGED_FILES: ${{ inputs.changed-files }}
        LOG_FILE: ${{ inputs.log-file }}
        MARKDOWN_CHECK: ${{ github.action_path }}/../../scripts/check-markdown.mjs
        ANALYST_PROJECTS: ${{ github.action_path }}/analyst-projects.py
        ENVIRONMENT_TESTS: ${{ github.action_path }}/analyst-projects.test.mjs ${{ github.action_path }}/../environment-setup/toolchain.test.mjs ${{ github.action_path }}/../environment-setup/dotnet-resolve.test.mjs
      run: |
        # GitHub runs `shell: bash` with `-e`; this script handles failures itself (status) and must always write its
        # outputs, so a non-matching grep (for example when every changed file is covered) must not end it early.
        set +e -uo pipefail
        PLATFORM_SOLUTION=src/platform/SocAlytics.Platform.slnx
        PLATFORM_SCOPE='^(src/platform|contracts)/'
        # Test projects that every task runs in full (fast rule tests).
        PLATFORM_ALWAYS='Architecture\.Tests\.csproj$'
        MANAGER_SOLUTION=src/analysts/manager/SocAlytics.Analysts.Manager.slnx
        MANAGER_SCOPE='^src/analysts/manager/'
        MANAGER_TRIGGER='^(src/analysts/manager|contracts/analyst-manager)/'
        WEB_DIR=src/clients/web
        WEB_SCOPE='^src/clients/web/'
        WEB_TRIGGER='^(src/clients/web|src/platform/SocAlytics\.Platform\.Api)/'
        ENVIRONMENT_TRIGGER='^\.github/actions/environment-(setup|verify)/'
        # Must equal the Playwright pin in environment-setup.
        WEB_PLAYWRIGHT=1.63.0
        # Paths that need no check (repository metadata, Spec Kit artifacts, and the environment actions, which the
        # merge self-tests). A check adds its scope only when it can run, so changes in the scope of a check whose
        # project is missing (for example a deleted solution) are reported as not covered. The platform scope also
        # covers the repository-root contracts/ folder, whose schemas the platform contract tests validate, and is
        # covered only while the platform solution exists.
        COVERED=(
          '\.md$'
          '^specs/'
          '^\.gitignore$'
          '^\.gitattributes$'
          '^\.editorconfig$'
          '^\.github/actions/environment-(setup|verify)/'
        )
        [ -f "$WORKSPACE/$PLATFORM_SOLUTION" ] && COVERED+=("$PLATFORM_SCOPE")
        [ -f "$WORKSPACE/$MANAGER_SOLUTION" ] && COVERED+=("$MANAGER_SCOPE")
        [ -f "$WORKSPACE/$WEB_DIR/package.json" ] && COVERED+=("$WEB_SCOPE")
        mkdir -p "$(dirname "$LOG_FILE")"
        : > "$LOG_FILE"
        # Test results (TRX logs) for the reruns of failed tests, and the tests that passed only on their rerun.
        RESULTS_ROOT="$(mktemp -d)"
        FLAKY_FILE="$RESULTS_ROOT/flaky.txt"
        : > "$FLAKY_FILE"
        results_count=0
        # A test project with more failed tests than this is not rerun: so many failures are not flaky.
        RERUN_LIMIT=10
        changed=""
        [ -n "$CHANGED_FILES" ] && [ -f "$CHANGED_FILES" ] && changed="$(cat "$CHANGED_FILES")"

        # Recognized Analyst Python projects (the SDK and capabilities): the helper validates every existing project and
        # selects those the mode and the changed paths call for, in dependency order. The roots of existing projects
        # become covered source scopes; a deleted or unrecognized project stays uncovered.
        analyst_python="${SOCALYTICS_PYTHON:-python3}"
        analyst_error_file="$(mktemp)"
        analyst_output="$("$analyst_python" "$ANALYST_PROJECTS" select --root "$WORKSPACE" --mode "$MODE" --changed-files "$CHANGED_FILES" 2> "$analyst_error_file")"
        analyst_status=$?
        analyst_error="$(cat "$analyst_error_file")"
        rm -f "$analyst_error_file"
        analyst_selected=""
        if [ "$analyst_status" -eq 0 ]; then
          analyst_lines="$(node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));for(const p of r.projects)console.log("S "+p.root);for(const c of r.covered)console.log("C "+c)' <<< "$analyst_output")"
          analyst_selected="$(sed -n 's/^S //p' <<< "$analyst_lines")"
          while IFS= read -r analyst_root; do
            [ -n "$analyst_root" ] && COVERED+=("^$(sed 's/[][(){}.^$?+*|\\]/\\&/g' <<< "$analyst_root")/")
          done < <(sed -n 's/^C //p' <<< "$analyst_lines")
        fi

        # Recognized agent Python projects (src/agents/<name>): same helper and convention, selected and covered
        # independently of the Analyst projects.
        agent_error_file="$(mktemp)"
        agent_output="$("$analyst_python" "$ANALYST_PROJECTS" select --area agents --root "$WORKSPACE" --mode "$MODE" --changed-files "$CHANGED_FILES" 2> "$agent_error_file")"
        agent_status=$?
        agent_error="$(cat "$agent_error_file")"
        rm -f "$agent_error_file"
        agent_selected=""
        if [ "$agent_status" -eq 0 ]; then
          agent_lines="$(node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));for(const p of r.projects)console.log("S "+p.root);for(const c of r.covered)console.log("C "+c)' <<< "$agent_output")"
          agent_selected="$(sed -n 's/^S //p' <<< "$agent_lines")"
          while IFS= read -r agent_root; do
            [ -n "$agent_root" ] && COVERED+=("^$(sed 's/[][(){}.^$?+*|\\]/\\&/g' <<< "$agent_root")/")
          done < <(sed -n 's/^C //p' <<< "$agent_lines")
        fi

        # applies <regex>: true in finalize mode or when a changed path matches.
        applies() {
          [ "$MODE" = finalize ] || { [ -n "$changed" ] && grep -qE "$1" <<< "$changed"; }
        }
        tests_label() { [ "$MODE" = task ] && echo "affected tests" || echo tests; }
        step() {
          local start end command_status
          local -a pipeline_status
          start="$(date +%s%3N)"
          echo "\$ $*" | tee -a "$LOG_FILE"
          "$@" 2>&1 | tee -a "$LOG_FILE"
          pipeline_status=("${PIPESTATUS[@]}")
          command_status="${pipeline_status[0]}"
          [ "$command_status" -ne 0 ] || command_status="${pipeline_status[1]}"
          end="$(date +%s%3N)"
          echo "Duration: $((end - start)) ms; exit: $command_status; command: $*" | tee -a "$LOG_FILE"
          printf '| `%s` | %s | %s |\n' "$*" "$((end - start))" "$command_status" >> "$GITHUB_STEP_SUMMARY"
          return "$command_status"
        }
        sdk_pin() { node -e 'const s=require(process.argv[1]).sdk||{};console.log(JSON.stringify(Object.fromEntries(Object.entries(s).sort())))' "$PWD/$1" 2>/dev/null; }
        # trx_failed <results directory>: the fully qualified names of the failed tests in its TRX logs, one per line
        # (TestDefinitions className and name of each failed UnitTestResult; its testName when the definition is missing).
        trx_failed() {
          node -e '
            const fs = require("fs"), path = require("path");
            const decode = (s) => s.replace(/&(lt|gt|quot|apos|amp|#x[0-9a-f]+|#\d+);/gi, (m, e) => ({ lt: "<", gt: ">", quot: "\"", apos: "\x27", amp: "&" })[e.toLowerCase()]
              ?? String.fromCodePoint(e[1] === "x" || e[1] === "X" ? parseInt(e.slice(2), 16) : Number(e.slice(1))));
            const attributes = (text) => Object.fromEntries([...text.matchAll(/([\w:]+)="([^"]*)"/g)].map((m) => [m[1], decode(m[2])]));
            const bare = (name) => String(name ?? "").replace(/\(.*$/s, "").trim();
            const files = [];
            const walk = (dir) => { for (const entry of fs.readdirSync(dir, { withFileTypes: true })) { const file = path.join(dir, entry.name); if (entry.isDirectory()) walk(file); else if (file.endsWith(".trx")) files.push(file); } };
            if (fs.existsSync(process.argv[1])) walk(process.argv[1]);
            const names = new Set();
            for (const file of files) {
              const xml = fs.readFileSync(file, "utf8");
              const definitions = new Map();
              for (const m of xml.matchAll(/<UnitTest\b([^>]*?)\/?>([\s\S]*?)<\/UnitTest>/g)) {
                const method = m[2].match(/<TestMethod\b([^>]*?)\/?>/);
                if (!method) continue;
                const { className = "", name = "" } = attributes(method[1]);
                const type = className.split(",")[0].trim();
                const test = bare(name);
                definitions.set(attributes(m[1]).id, type && !test.startsWith(`${type}.`) ? `${type}.${test}` : test);
              }
              for (const m of xml.matchAll(/<UnitTestResult\b([^>]*?)\/?>/g)) {
                const result = attributes(m[1]);
                if (result.outcome !== "Failed") continue;
                const name = definitions.get(result.testId) || bare(result.testName);
                if (name) names.add(name);
              }
            }
            for (const name of names) console.log(name);
          ' "$1" 2>/dev/null
        }
        # dotnet_test <project> [arguments]: runs one test project with a TRX log. When it fails with at most RERUN_LIMIT
        # failed tests whose names the log gives, only those tests run once more; when they pass then, the project
        # passes and they are recorded as flaky. Otherwise the project fails.
        dotnet_test() {
          local project="$1" results failed count filter
          shift
          results_count=$((results_count + 1))
          results="$RESULTS_ROOT/$results_count"
          step dotnet test "$project" --no-build "$@" --logger trx --results-directory "$results" && return 0
          failed="$(trx_failed "$results")"
          count="$(grep -c . <<< "$failed")"
          if [ "$count" -eq 0 ]; then
            echo "No rerun of $project: the test results name no failed test" | tee -a "$LOG_FILE"
            return 1
          fi
          if [ "$count" -gt "$RERUN_LIMIT" ]; then
            echo "No rerun of $project: $count tests failed (more than $RERUN_LIMIT)" | tee -a "$LOG_FILE"
            return 1
          fi
          echo "Rerunning the $count failed test(s) of $project once: $(paste -sd, - <<< "$failed")" | tee -a "$LOG_FILE"
          filter="$(sed 's/[\\()&|=!~]/\\&/g; s/^/FullyQualifiedName=/' <<< "$failed" | paste -sd'|' -)"
          step dotnet test "$project" --no-build --filter "$filter" || return 1
          echo "Flaky (passed on rerun): $(paste -sd, - <<< "$failed")" | tee -a "$LOG_FILE"
          printf '%s\n' "$failed" >> "$FLAKY_FILE"
        }
        # playwright_flaky: the tests that Playwright's list or line reporter lists under "N flaky" in its summary.
        playwright_flaky() {
          node -e '
            const lines = require("fs").readFileSync(0, "utf8").replace(/\x1b\[[0-9;]*m/g, "").split(/\r?\n/);
            let listing = false;
            for (const line of lines) {
              if (/^\s*\d+ flaky\s*$/.test(line)) { listing = true; continue; }
              if (listing && line.includes("\u203a")) { console.log(line.trim().replace(/[\s\u2500]+$/, "")); continue; }
              listing = false;
            }
          '
        }

        checks=()
        status=0
        {
          echo "### Verification command timings ($MODE)"
          echo "| Command | Duration (ms) | Exit code |"
          echo "| --- | --- | --- |"
        } >> "$GITHUB_STEP_SUMMARY"
        pushd "$WORKSPACE" > /dev/null
        ROOT="$PWD"

        # run_tests <solution> <repo path prefix of the current directory> <always-run project regex>
        # phase and finalize: every test project, one after another in sorted order (Docker-backed projects must never
        # run at the same time on the one daemon); a failing project does not stop the later ones. task: the always-run
        # test projects; the test classes declared in the changed .cs files of a test project; the whole test project
        # when other files of it changed (fixtures without a class, project files). A test project the task did not
        # touch is skipped; the phase verification and the merge run it. Each project runs through dotnet_test, which
        # reruns a few failed tests once.
        run_tests() {
          local solution="$1" prefix="$2" always="$3" result=0 project rel files file found classes whole filter
          while IFS= read -r project; do
            [ -n "$project" ] || continue
            if [ "$MODE" != task ]; then
              dotnet_test "$project" || result=1
              continue
            fi
            if [ -n "$always" ] && grep -qE "$always" <<< "$project"; then
              dotnet_test "$project" || result=1
              continue
            fi
            rel="$prefix$(dirname "$project")/"
            files="$(awk -v p="$rel" 'index($0, p) == 1' <<< "$changed")"
            [ -n "$files" ] || continue
            classes=""
            whole=0
            while IFS= read -r file; do
              [ -f "$ROOT/$file" ] || continue
              if [[ "$file" == *.cs ]]; then
                found="$(grep -oP '^\s*(?:(?:public|internal|sealed|static|partial|abstract|file)\s+)*class\s+\K\w+' "$ROOT/$file")"
                if [ -n "$found" ]; then classes+="$found"$'\n'; else whole=1; fi
              else
                whole=1
              fi
            done <<< "$files"
            if [ "$whole" -eq 1 ]; then
              dotnet_test "$project" || result=1
            elif [ -n "$classes" ]; then
              filter="$(grep -v '^$' <<< "$classes" | sort -u | sed 's/^/FullyQualifiedName~/' | paste -sd'|' -)"
              dotnet_test "$project" --filter "$filter" || result=1
            fi
          done < <(find "$(dirname "$solution")" -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | sed 's|^\./||' | sort)
          return "$result"
        }
        if [ "$status" -eq 0 ] && applies "$PLATFORM_SCOPE" && [ -f "$PLATFORM_SOLUTION" ]; then
          checks+=("platform build and $(tests_label)")
          { step dotnet restore "$PLATFORM_SOLUTION" &&
            step dotnet build "$PLATFORM_SOLUTION" --no-restore &&
            run_tests "$PLATFORM_SOLUTION" '' "$PLATFORM_ALWAYS"; } || status=1
        fi
        # Active only once the Analyst Manager solution exists; it also runs for changes under contracts/analyst-manager/
        # because the Manager tests read the shared golden fixtures there.
        if [ "$status" -eq 0 ] && applies "$MANAGER_TRIGGER" && [ -f "$MANAGER_SOLUTION" ]; then
          checks+=("Analyst Manager build and $(tests_label)")
          platform_pin="$(sdk_pin src/platform/global.json)"
          manager_pin="$(sdk_pin src/analysts/manager/global.json)"
          if [ -z "$manager_pin" ] || [ "$manager_pin" != "$platform_pin" ]; then
            echo "Analyst Manager SDK pin ${manager_pin:-<missing>} in src/analysts/manager/global.json differs from the platform pin ${platform_pin:-<missing>} in src/platform/global.json" | tee -a "$LOG_FILE"
            status=1
          else
            pushd src/analysts/manager > /dev/null
            { step dotnet restore SocAlytics.Analysts.Manager.slnx &&
              step dotnet build SocAlytics.Analysts.Manager.slnx --no-restore &&
              run_tests SocAlytics.Analysts.Manager.slnx src/analysts/manager/ ''; } || status=1
            popd > /dev/null
          fi
        fi
        # Active only once the Web UI project exists; it also runs for platform API changes because the Web UI build
        # generates its client from the API contract. Browser downloads stay in environment-setup.
        web_playwright_pin() {
          local installed
          installed="$(node -e 'console.log(require(process.argv[1]).version)' "$PWD/node_modules/@playwright/test/package.json" 2>/dev/null)"
          if [ "$installed" != "$WEB_PLAYWRIGHT" ]; then
            echo "@playwright/test ${installed:-<not installed>} in $WEB_DIR differs from WEB_PLAYWRIGHT $WEB_PLAYWRIGHT (the Playwright pin in environment-setup)" | tee -a "$LOG_FILE"
            return 1
          fi
        }
        web_step() {
          local name="$1"
          shift
          echo "Web UI step: $name" | tee -a "$LOG_FILE"
          "$@" || { echo "Web UI step failed: $name" | tee -a "$LOG_FILE"; return 1; }
        }
        # The browser tests retry a failed test once; the tests that passed on their retry are recorded as flaky.
        web_browser_tests() {
          local before result
          before="$(wc -l < "$LOG_FILE")"
          step npm run test:e2e -- --retries=1
          result=$?
          tail -n "+$((before + 1))" "$LOG_FILE" | playwright_flaky >> "$FLAKY_FILE"
          return "$result"
        }
        if [ "$status" -eq 0 ] && applies "$WEB_TRIGGER" && [ -f "$WEB_DIR/package.json" ]; then
          checks+=("Web UI build and tests")
          pushd "$WEB_DIR" > /dev/null
          { web_step install step env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci &&
            web_step 'playwright pin' web_playwright_pin &&
            web_step build step npm run build &&
            web_step 'unit tests' step npm test &&
            web_step 'browser tests' web_browser_tests; } || status=1
          popd > /dev/null
        fi
        # Analyst and agent Python projects: the environment owns the exact command sequence, run with the interpreter
        # that environment-setup installed (SOCALYTICS_PYTHON) and Python downloads disabled. The first failing stage
        # stops the check; the committed declarations and locks are never changed. The label (Analyst or Agent) only
        # names the project area in the log lines.
        python_project() {
          local root="$1" label="$2" stage
          local -a commands=(
            "bootstrap sync|uv sync --locked --all-groups --no-install-local --no-build|correct the consuming project's dependency declarations (manifest, uv.lock, locked wheels, and locked build backends) and commit them, then retry verification; verification never repairs or unlocks them"
            "project sync|uv sync --locked --all-groups --no-build-isolation|reproduce this command in the named project, correct its package or local-dependency declarations so the locked backends build it, and retry verification"
            "wheel build|uv build --wheel --no-build-isolation --python .venv/bin/python|reproduce this command in the named project, correct the package build failure in its source or build configuration, and retry verification"
            "tests|uv run --no-sync pytest|reproduce this command in the named project, correct the failing or missing tests or the source they cover without weakening them (pytest needs at least one collectable test), and retry verification"
          )
          local entry command recommendation rest
          echo "$label Python project: $root" | tee -a "$LOG_FILE"
          for entry in "${commands[@]}"; do
            stage="${entry%%|*}"
            rest="${entry#*|}"
            command="${rest%%|*}"
            recommendation="${rest#*|}"
            read -r -a words <<< "$command"
            echo "$label Python stage: $stage ($root)" | tee -a "$LOG_FILE"
            step env UV_PYTHON_DOWNLOADS=never UV_PYTHON="$SOCALYTICS_PYTHON" "${words[@]}" || {
              echo "$label Python stage failed: $stage in $root (command: $command). Recommended action: $recommendation" | tee -a "$LOG_FILE"
              return 1
            }
          done
        }
        if [ "$status" -eq 0 ] && { [ "$analyst_status" -ne 0 ] || [ -n "$analyst_selected" ]; }; then
          checks+=("Analyst Python projects")
          if [ "$analyst_status" -ne 0 ]; then
            echo "Analyst Python projects: discovery failed (exit $analyst_status) using $analyst_python" | tee -a "$LOG_FILE"
            [ -n "$analyst_error" ] && echo "$analyst_error" | tee -a "$LOG_FILE"
            if ! grep -q 'Recommended action:' <<< "$analyst_error"; then
              echo "Analyst Python projects: discovery could not run. Recommended action: run environment-setup with install-tools true so SOCALYTICS_PYTHON names a working interpreter, then retry verification" | tee -a "$LOG_FILE"
            fi
            status=1
          elif [ -z "${SOCALYTICS_PYTHON:-}" ] || [ ! -x "$SOCALYTICS_PYTHON" ] || ! command -v uv > /dev/null; then
            echo "Analyst Python projects: environment setup: SOCALYTICS_PYTHON and uv from environment-setup are required. Recommended action: run environment-setup with install-tools true before verification" | tee -a "$LOG_FILE"
            status=1
          else
            while IFS= read -r analyst_root; do
              pushd "$analyst_root" > /dev/null
              python_project "$analyst_root" Analyst || status=1
              popd > /dev/null
              [ "$status" -eq 0 ] || break
            done <<< "$analyst_selected"
          fi
        fi
        if [ "$status" -eq 0 ] && { [ "$agent_status" -ne 0 ] || [ -n "$agent_selected" ]; }; then
          checks+=("Agent Python projects")
          if [ "$agent_status" -ne 0 ]; then
            echo "Agent Python projects: discovery failed (exit $agent_status) using $analyst_python" | tee -a "$LOG_FILE"
            [ -n "$agent_error" ] && echo "$agent_error" | tee -a "$LOG_FILE"
            if ! grep -q 'Recommended action:' <<< "$agent_error"; then
              echo "Agent Python projects: discovery could not run. Recommended action: run environment-setup with install-tools true so SOCALYTICS_PYTHON names a working interpreter, then retry verification" | tee -a "$LOG_FILE"
            fi
            status=1
          elif [ -z "${SOCALYTICS_PYTHON:-}" ] || [ ! -x "$SOCALYTICS_PYTHON" ] || ! command -v uv > /dev/null; then
            echo "Agent Python projects: environment setup: SOCALYTICS_PYTHON and uv from environment-setup are required. Recommended action: run environment-setup with install-tools true before verification" | tee -a "$LOG_FILE"
            status=1
          else
            while IFS= read -r agent_root; do
              pushd "$agent_root" > /dev/null
              python_project "$agent_root" Agent || status=1
              popd > /dev/null
              [ "$status" -eq 0 ] || break
            done <<< "$agent_selected"
          fi
        fi
        # The environment-local Node tests of both environment actions run when either action folder changed and in
        # finalize mode, whether or not an Analyst Python project exists. They use the caller-provided node, and their
        # fixtures never start this check again: the marker below makes a nested run skip it.
        if [ "$status" -eq 0 ] && [ -n "${ENVIRONMENT_TESTS:-}" ] && [ -z "${SOCALYTICS_ENVIRONMENT_TESTS_RUNNING:-}" ] && applies "$ENVIRONMENT_TRIGGER"; then
          checks+=("Environment action tests")
          read -r -a environment_tests <<< "$ENVIRONMENT_TESTS"
          step env SOCALYTICS_ENVIRONMENT_TESTS_RUNNING=1 node --test "${environment_tests[@]}" || {
            echo "Environment action tests failed (command: node --test ${environment_tests[*]}). Recommended action: reproduce this command, correct the failing environment action or its test without weakening the test, and retry verification" | tee -a "$LOG_FILE"
            status=1
          }
        fi
        if [ "$status" -eq 0 ] && applies '\.md$'; then
          checks+=("Markdown check")
          # A task or parallel group checks only the Markdown files it changed, so a broken file elsewhere on the base
          # branch does not fail it; phase and finalize verification check the whole repository.
          if [ "$MODE" = task ] && [ -n "$CHANGED_FILES" ] && [ -f "$CHANGED_FILES" ]; then
            step node "$MARKDOWN_CHECK" --files "$CHANGED_FILES" || status=1
          else
            step node "$MARKDOWN_CHECK" || status=1
          fi
        fi
        popd > /dev/null

        uncovered=""
        if [ -n "$changed" ]; then
          uncovered="$(grep -vE "$(IFS='|'; echo "${COVERED[*]}")" <<< "$changed" | grep -v '^$' | paste -sd, -)"
        fi
        # Commas would split a name in the comma-separated output.
        flaky="$(grep -v '^$' "$FLAKY_FILE" | tr ',' ';' | awk '!seen[$0]++' | paste -sd, -)"
        if [ -n "$flaky" ]; then
          echo "Flaky tests (passed on rerun): $flaky" | tee -a "$LOG_FILE"
          {
            echo
            echo "### Flaky tests (passed on rerun)"
            grep -v '^$' "$FLAKY_FILE" | tr ',' ';' | awk '!seen[$0]++' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        rm -rf "$RESULTS_ROOT"
        (IFS=,; echo "checks=${checks[*]}") >> "$GITHUB_OUTPUT"
        echo "uncovered=${uncovered}" >> "$GITHUB_OUTPUT"
        echo "flaky=${flaky}" >> "$GITHUB_OUTPUT"
        exit "$status"
