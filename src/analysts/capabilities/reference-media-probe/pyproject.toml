[project]
name = "socalytics-reference-media-probe"
version = "1.0.0"
description = "SocAlytics reference Analyst capability that probes staged segment media"
requires-python = ">=3.12,<3.13"
dependencies = [
    "socalytics-analyst-sdk",
]

[tool.uv.sources]
socalytics-analyst-sdk = { path = "../../sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["hatchling", "pytest", "jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/reference_media_probe"]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
