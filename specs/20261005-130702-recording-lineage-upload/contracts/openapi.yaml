openapi: 3.1.0
info:
  title: SocAlytics Platform API - Recordings
  version: 1.0.0
  summary: Recording upload, immutable recording lineage, and recording-set finalization.
  description: >-
    Fragment of the platform `/api/v1` surface owned by the Recordings functional area
    (feature 20261005-130702-recording-lineage-upload). The platform never receives media
    bytes: every upload is one S3 multipart upload with composite SHA-256 checksums, written
    directly to S3-compatible object storage through short-lived per-part grants that bind
    each part's number, exact length, and digest. Recording content digests use
    sha-256-parts:<partSizeBytes>:<partCount>:<hex>. Authentication, the session cookie,
    anti-forgery, and the
    shared problem-details catalog are owned by the Club and Identity contract; this fragment
    references them and adds only recording operations and problem codes. Problem `type` URIs
    are `urn:socalytics:problem:<code>`, using the codes listed on each response.
  license:
    name: Proprietary
    identifier: LicenseRef-SocAlytics
servers:
  - url: /
tags:
  - name: Recording uploads
  - name: Recording lineage
security:
  - sessionCookie: []
paths:
  /api/v1/matches/{matchId}/upload-sessions:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      operationId: startRecordingUpload
      tags: [Recording uploads]
      summary: Start a multipart upload session and receive grants for its first parts.
      description: >-
        Requires Club Admin or the Coach role on the Match's Team (TeamPermission.Write).
        Validates the part declaration, creates a pending upload session with one storage
        multipart upload (SHA-256 composite checksums) at a platform-chosen location, and
        returns grants for parts 1..min(partCount, configured maximum per request). Request
        further grants with issueRecordingUploadGrants. Replaying the same Idempotency-Key with
        the same content returns the original session with freshly issued grants (grants are
        never stored).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartUploadRequest'
      responses:
        '201':
          description: Upload session created (or replayed) with fresh grants for its first parts.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/StrongETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionWithGrants'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StartUploadConflict'
        '503':
          $ref: '#/components/responses/ObjectStorageUnavailable'
  /api/v1/matches/{matchId}/upload-sessions/{uploadSessionId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/UploadSessionId'
    get:
      operationId: getRecordingUploadSession
      tags: [Recording uploads]
      summary: Read an upload session's state.
      description: Requires Club Admin or the Coach role on the Match's Team. Never returns a grant.
      responses:
        '200':
          description: The upload session.
          headers:
            ETag:
              $ref: '#/components/headers/StrongETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/matches/{matchId}/upload-sessions/{uploadSessionId}/grants:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/UploadSessionId'
    post:
      operationId: issueRecordingUploadGrants
      tags: [Recording uploads]
      summary: Issue fresh upload grants for requested parts of a pending session.
      description: >-
        Requires current Club Admin or Coach authority. Each grant permits writing only its
        part, with exactly the declared size and digest, to the session's single storage
        location, and conveys no other authority. Unknown or differently scoped sessions yield
        404; completed or expired sessions yield 409.
      parameters:
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartGrantRequest'
      responses:
        '200':
          description: Fresh time-limited grants for the requested parts.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartGrantBatch'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GrantConflict'
        '503':
          $ref: '#/components/responses/ObjectStorageUnavailable'
  /api/v1/matches/{matchId}/upload-sessions/{uploadSessionId}/completion:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/UploadSessionId'
    post:
      operationId: completeRecordingUpload
      tags: [Recording uploads]
      summary: Assemble the declared parts and accept the verified object as a recording version.
      description: >-
        The platform lists the stored parts, requires exactly parts 1..partCount with their
        declared sizes, completes the multipart upload itself with the declared per-part and
        composite SHA-256 checksums, and accepts the object only when storage reports the
        expected sha-256-parts composite (type COMPOSITE) and total size. It then atomically
        creates one recording version and its first timeline mapping and marks the session
        completed. Rejections before assembly leave the session pending so parts can be
        re-uploaded.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '201':
          description: Upload accepted (or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedUpload'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CompletionConflict'
        '503':
          $ref: '#/components/responses/ObjectStorageUnavailable'
  /api/v1/matches/{matchId}/recording-versions/{recordingVersionId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/RecordingVersionId'
    get:
      operationId: getRecordingVersion
      tags: [Recording lineage]
      summary: Read one immutable recording version.
      description: Requires Club Admin or a Coach or Viewer role on the Match's Team.
      responses:
        '200':
          description: The recording version.
          headers:
            ETag:
              $ref: '#/components/headers/StrongETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/matches/{matchId}/recording-versions/{recordingVersionId}/timeline-mappings:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/RecordingVersionId'
    post:
      operationId: reviseRecordingTimelineMapping
      tags: [Recording lineage]
      summary: Bind a revised timeline mapping to an accepted recording version.
      description: >-
        Creates a new immutable timeline mapping with a new identity and digest. Content
        identical to an existing mapping of the same recording version returns that mapping
        with 200 instead of creating a duplicate. Prior mappings are never changed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineMappingContent'
      responses:
        '200':
          description: Identical content; the existing mapping is returned.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineMapping'
        '201':
          description: A new timeline mapping was created (or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineMapping'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
  /api/v1/matches/{matchId}/timeline-mappings/{timelineMappingId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/TimelineMappingId'
    get:
      operationId: getRecordingTimelineMapping
      tags: [Recording lineage]
      summary: Read one immutable timeline mapping.
      description: Requires Club Admin or a Coach or Viewer role on the Match's Team.
      responses:
        '200':
          description: The timeline mapping.
          headers:
            ETag:
              $ref: '#/components/headers/StrongETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineMapping'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/matches/{matchId}/recording-set-versions:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      operationId: finalizeRecordingSet
      tags: [Recording lineage]
      summary: Finalize an ordered recording set as a new immutable recording-set version.
      description: >-
        Atomically creates the recording-set version, its ordered memberships, and exactly one
        recordings-finalized event record. The whole request is rejected, creating nothing, if
        the list is empty, any member is unknown or belongs to another Match, a mapping is not
        bound to its paired recording version, or a recording version repeats. Distinct
        Idempotency-Keys create distinct set versions.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AntiforgeryToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeRecordingSetRequest'
      responses:
        '201':
          description: Recording-set version finalized (or replayed).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSetVersion'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MutationConflict'
  /api/v1/matches/{matchId}/recording-set-versions/{recordingSetVersionId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/RecordingSetVersionId'
    get:
      operationId: getRecordingSetVersion
      tags: [Recording lineage]
      summary: Read one finalized recording-set version with its ordered members.
      description: Requires Club Admin or a Coach or Viewer role on the Match's Team.
      responses:
        '200':
          description: The finalized recording-set version.
          headers:
            ETag:
              $ref: '#/components/headers/StrongETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSetVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/matches/{matchId}/recording-lineage:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      operationId: getMatchRecordingLineage
      tags: [Recording lineage]
      summary: List a Match's recording versions, timeline mappings, and finalized set versions.
      description: >-
        Requires Club Admin or a Coach or Viewer role on the Match's Team. Discloses metadata
        only; never issues media access or upload grants. The weak ETag serves caching only.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The Match's recording lineage.
          headers:
            ETag:
              $ref: '#/components/headers/WeakETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingLineage'
        '304':
          description: The lineage has not changed since the supplied ETag.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-socalytics-session
      description: >-
        Server-validated human session established by Club and Identity (Secure, HttpOnly,
        SameSite=Strict).
  parameters:
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    UploadSessionId:
      name: uploadSessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    RecordingVersionId:
      name: recordingVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    TimelineMappingId:
      name: timelineMappingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    RecordingSetVersionId:
      name: recordingSetVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Opaque caller-chosen retry key scoped to this operation and Match. Same key and same
        content replays the original outcome; same key with different content is a 409.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
    AntiforgeryToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Anti-forgery proof issued by Club and Identity for the current session.
      schema:
        type: string
        minLength: 1
  headers:
    Location:
      description: URI of the created or returned resource.
      schema:
        type: string
        format: uri-reference
    StrongETag:
      description: Strong validator; the version for upload sessions, the identity for immutable resources.
      schema:
        type: string
    WeakETag:
      description: Weak validator derived from the identities of everything the view contains.
      schema:
        type: string
    NoStore:
      description: Always `no-store`; responses carrying grants must not be cached.
      schema:
        type: string
        const: no-store
  responses:
    ValidationProblem:
      description: >-
        The request is invalid. Codes: `validation-failed`, `idempotency-key-missing`,
        `upload-declaration-invalid`, `part-numbers-invalid`, `content-type-not-allowed`,
        `timeline-mapping-invalid`, `recording-set-empty`, `recording-set-member-invalid`,
        `recording-set-duplicate-recording`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No valid session. Code `unauthenticated`. No redirect is issued.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        The caller lacks current authority for the Match's Team, or the scope cannot be
        resolved. Code `forbidden`. No lineage or stored outcome is disclosed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >-
        The Match does not exist, or the addressed session, recording version, mapping, or set
        version does not exist within that Match. Code `not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StartUploadConflict:
      description: 'Codes: `season-archived`, `idempotency-key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GrantConflict:
      description: 'Codes: `season-archived`, `upload-session-completed`, `upload-session-expired`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CompletionConflict:
      description: >-
        Codes: `season-archived`, `idempotency-key-reused`, `upload-session-completed`,
        `upload-session-expired`, `upload-parts-incomplete`, `upload-part-mismatch`,
        `upload-object-mismatch`, `integrity-evidence-unavailable`. Rejections before
        assembly leave the session pending.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MutationConflict:
      description: 'Codes: `season-archived`, `idempotency-key-reused`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ObjectStorageUnavailable:
      description: Object storage could not be reached. Code `object-storage-unavailable`. No state changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Identifier:
      type: string
      minLength: 1
      description: Opaque domain identifier.
    Sha256Digest:
      type: string
      pattern: '^sha-256:[0-9a-f]{64}$'
    CompositeDigest:
      type: string
      description: >-
        Composite multipart content digest sha-256-parts:<partSizeBytes>:<partCount>:<hex>,
        where hex is SHA-256 over the concatenated raw SHA-256 digests of the parts in order.
        Never comparable with a plain sha-256 digest.
      pattern: '^sha-256-parts:[1-9][0-9]{0,9}:[1-9][0-9]{0,4}:[0-9a-f]{64}$'
    Timestamp:
      type: string
      format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details with the shared SocAlytics extension members.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    RecordingDescriptor:
      type: object
      additionalProperties: false
      required: [displayName, contentType]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        contentType:
          type: string
          description: Media type; must be one of the stamp's configured allowed content types.
    StartUploadRequest:
      type: object
      additionalProperties: false
      description: >-
        Multipart declaration. partCount = ceil(totalSizeBytes / partSizeBytes) must equal the
        number of partDigests; every part except the last is exactly partSizeBytes; when more
        than one part is declared, partSizeBytes must be at least 5242880 (storage minimum).
        The stamp's configured maximum object size, part size bounds, and part count apply.
      required: [recording, totalSizeBytes, partSizeBytes, partDigests]
      properties:
        recording:
          $ref: '#/components/schemas/RecordingDescriptor'
        totalSizeBytes:
          type: integer
          minimum: 1
          maximum: 5497558138880
        partSizeBytes:
          type: integer
          minimum: 1
          maximum: 5368709120
        partDigests:
          type: array
          description: SHA-256 digest of each part, in part order (part 1 first).
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Sha256Digest'
    UploadSession:
      type: object
      required: [id, matchId, teamId, state, recording, totalSizeBytes, partSizeBytes, partCount, contentDigest, createdAt, expiresAt, version]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        matchId:
          $ref: '#/components/schemas/Identifier'
        teamId:
          $ref: '#/components/schemas/Identifier'
        state:
          type: string
          enum: [pending, completed, expired]
        recording:
          $ref: '#/components/schemas/RecordingDescriptor'
        totalSizeBytes:
          type: integer
        partSizeBytes:
          type: integer
        partCount:
          type: integer
          minimum: 1
          maximum: 10000
        contentDigest:
          $ref: '#/components/schemas/CompositeDigest'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        expiredAt:
          $ref: '#/components/schemas/Timestamp'
        recordingVersionId:
          $ref: '#/components/schemas/Identifier'
        version:
          type: integer
          minimum: 1
    PartGrantRequest:
      type: object
      additionalProperties: false
      required: [partNumbers]
      properties:
        partNumbers:
          type: array
          description: >-
            Distinct part numbers within 1..partCount; at most the stamp's configured maximum
            per request.
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000
    PartGrant:
      type: object
      description: >-
        Transient authority to PUT exactly one part with its declared size and digest. Never
        stored or logged by the platform.
      required: [partNumber, method, url, requiredHeaders]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
        requiredHeaders:
          type: object
          description: >-
            Headers the client must send unchanged with the PUT; no other x-amz-* header may be
            sent.
          required: [Content-Length, x-amz-checksum-sha256]
          additionalProperties: false
          properties:
            Content-Length:
              type: string
              pattern: '^[1-9][0-9]*$'
              description: Exact byte length of this part.
            x-amz-checksum-sha256:
              type: string
              description: Base64 SHA-256 of this part's declared digest.
    PartGrantBatch:
      type: object
      required: [expiresAt, parts]
      properties:
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PartGrant'
    UploadSessionWithGrants:
      type: object
      required: [session, grants]
      properties:
        session:
          $ref: '#/components/schemas/UploadSession'
        grants:
          $ref: '#/components/schemas/PartGrantBatch'
    TimelineSpan:
      type: object
      additionalProperties: false
      description: >-
        Maps media time [mediaStartSeconds, mediaEndSeconds) to match time starting at
        matchStartSeconds at a 1:1 rate. Values have at most millisecond precision.
      required: [mediaStartSeconds, mediaEndSeconds, matchStartSeconds]
      properties:
        mediaStartSeconds:
          type: number
          minimum: 0
        mediaEndSeconds:
          type: number
          exclusiveMinimum: 0
        matchStartSeconds:
          type: number
          minimum: 0
    TimelineMappingContent:
      type: object
      additionalProperties: false
      description: >-
        Spans must be strictly increasing and non-overlapping in both media and match time,
        and each must have positive length.
      required: [spans]
      properties:
        spans:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/TimelineSpan'
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      required: [timelineMapping]
      properties:
        timelineMapping:
          $ref: '#/components/schemas/TimelineMappingContent'
    RecordingVersion:
      type: object
      required: [id, matchId, teamId, uploadSessionId, recording, totalSizeBytes, partSizeBytes, partCount, contentDigest, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        matchId:
          $ref: '#/components/schemas/Identifier'
        teamId:
          $ref: '#/components/schemas/Identifier'
        uploadSessionId:
          $ref: '#/components/schemas/Identifier'
        recording:
          $ref: '#/components/schemas/RecordingDescriptor'
        totalSizeBytes:
          type: integer
        partSizeBytes:
          type: integer
        partCount:
          type: integer
        contentDigest:
