installed:
- gha
settings:
  auto_execute_hooks: true
hooks:
  after_plan:
  - extension: gha
    command: speckit.gha.architecture
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.gha.architecture?
    description: Write the Architecture Updates section of the generated plan.md
    condition: null
  before_converge:
  - extension: gha
    command: speckit.gha.drift
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.gha.drift?
    description: Report architecture drift for convergence to turn into tasks
    condition: null
  before_implement:
  - extension: gha
    command: speckit.gha.route
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.gha.route?
    description: Choose local implementation or request implementation on GitHub
    condition: null
  after_tasks:
  - extension: gha
    command: speckit.gha.refine
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.gha.refine?
    description: Refine the parallel task groups of the generated tasks.md
    condition: null
  after_converge:
  - extension: gha
    command: speckit.gha.archive
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.gha.archive?
    description: Archive the converged spec before merging it locally (implementations
      on GitHub archive in their merge)
    condition: null
