schema_version: "1.0"
workflow:
  id: "repair"
  name: "Repair an implementation whose verification failed"
  version: "1.1.0"
  author: "socalytics"
  description: >-
    Repairs already-implemented tasks of a spec whose verification failed after their boxes were checked, checks that
    the repair leaves tasks.md and the protected paths alone, and writes result.json. It never commits or pushes; the
    failed scope is verified again afterwards. Every decision comes from .github/scripts/speckit-implement-flow.mjs.

# Common design of the gha workflows (see .specify/extension-src/gha/README.md, "Workflow design"): start → agent step →
# check → review gate (interactive mode only) → result.

requires:
  speckit_version: ">=1.0.13"
  integrations:
    any:
      - "copilot"

inputs:
  folder:
    type: string
    default: ""
    prompt: "Spec folder (specs/<folder>)"
  tasks:
    type: string
    default: ""
    prompt: "Task IDs whose implementation to repair, comma-separated (empty: the implemented scope)"
  scope:
    type: string
    default: "verification"
    prompt: "The verification that failed, for example task, group, phase, or finalize"
  evidence:
    type: string
    default: ""
    prompt: "Folder with the failure evidence, relative to the repository root (optional)"
  environment:
    type: string
    default: "false"
    prompt: "true when the spec is an environment spec, which may change the environment actions"
  guidance:
    type: string
    default: ""
    prompt: "Guidance for the agent (optional)"
  feedback:
    type: string
    default: ""
    prompt: "What should change in the previous run's repair, which is still in the working tree (optional)"
  mode:
    type: string
    default: "interactive"
    prompt: "interactive (review the repair) or unattended"
  tooling:
    type: string
    default: "."
    prompt: "Folder with the trusted .github/scripts helpers (GitHub passes its tooling checkout; locally the repository)"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use ('auto' uses the project's initialized integration)"
  review_verdict: {type: string, default: ""}

steps:
  - id: start
    type: shell
    run: 'node "{{ inputs.tooling }}/.github/scripts/speckit-implement-flow.mjs" start --run {{ context.run_id }} --workflow repair'
    output_format: json

  - id: repair
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 3600
    prompt: >-
      Repair the already-implemented {{ steps.start.output.data.tasks }} of the spec in
      `{{ steps.start.output.data.spec_dir }}/`. The {{ steps.start.output.data.scope }} verification failed after the
      related tasks were implemented and checked in `{{ steps.start.output.data.tasks_path }}`.
      {{ steps.start.output.data.evidence }} Do not untick, rewrite, or add tasks. Change only the implementation or
      directly related tests needed to make the failed verification pass; never weaken a test, assertion, or
      requirement. {{ steps.start.output.data.protected }} Do not commit and do not push.
      Build what you change and run the tests that cover it. If no code change is needed, leave the tree unchanged and
      explain why; the failed scope is verified again after you. {{ steps.start.output.data.extra }}

  - id: check
    type: shell
    run: 'node "{{ inputs.tooling }}/.github/scripts/speckit-implement-flow.mjs" check --run {{ context.run_id }}'
    output_format: json

  - id: review
    type: if
    condition: "{{ steps.start.output.data.interactive }}"
    then:
      - id: review-verdict
        type: gate
        message: "The repair {{ steps.check.output.data.summary }}. Accept it, revise it (the run stops and says how to give feedback), or abort."
        show_file: ".specify/workflows/runs/{{ context.run_id }}/changes.diff"
        options: ["accept", "revise", "abort"]
        on_reject: abort
        verdict_input: review_verdict
      - id: revise
        type: if
        condition: "{{ steps.review-verdict.output.choice == 'revise' }}"
        then:
          - id: stop-for-feedback
            type: shell
            run: 'node "{{ inputs.tooling }}/.github/scripts/speckit-implement-flow.mjs" revise --run {{ context.run_id }}'

  - id: result
    type: shell
    run: 'node "{{ inputs.tooling }}/.github/scripts/speckit-implement-flow.mjs" result --run {{ context.run_id }}'
    output_format: json
