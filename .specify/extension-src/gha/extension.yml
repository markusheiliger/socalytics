schema_version: "1.0"

extension:
  id: gha
  name: "GitHub Actions implementation routing"
  version: "1.10.0"
  description: "Guide spec authoring through the full Spec Kit flow to specs that only need to be committed, one at a time or a batch of the next logical specs, interactively or in autopilot, keep docs/architecture in sync with each plan and implementation, route /speckit-implement between local implementation and a validated implementation request for the speckit-orchestrate GitHub Actions workflow, refine the parallel task groups after /speckit-tasks, diagnose implementations that stopped, and archive implemented specs"
  author: socalytics
  repository: https://github.com/markusheiliger/socalytics
  license: MIT

requires:
  speckit_version: ">=1.0.13"
  tools:
    - name: git
      required: true
      description: "Reads the spec folder from the remote default branch"
    - name: node
      required: true
      description: "Runs .github/scripts/speckit-orchestrate.mjs, speckit-author.mjs, speckit-tasks-groups.mjs, and speckit-archive.mjs"
    - name: gh
      required: true
      description: "Provides the user's GitHub token to post the /speckit implement request on the twin"

provides:
  commands:
    - name: speckit.gha.author
      file: commands/speckit.gha.author.md
      description: "Guide specs from an idea, an architecture section, existing folders, or a request for the next N logical specs through specify, clarify, plan, tasks, analyze, and the publish checks until they only need to be committed; autopilot answers every decision with its recommended choice"
    - name: speckit.gha.route
      file: commands/speckit.gha.route.md
      description: "Choose between implementing locally and requesting implementation on GitHub"
    - name: speckit.gha.request
      file: commands/speckit.gha.request.md
      description: "Request implementation of the active spec by the speckit-orchestrate GitHub Actions workflow"
    - name: speckit.gha.diagnose
      file: commands/speckit.gha.diagnose.md
      description: "Diagnose why an implementation on GitHub stopped and decide how to continue; amend the spec artifacts only when they are the cause"
    - name: speckit.gha.refine
      file: commands/speckit.gha.refine.md
      description: "Refine the parallel task groups of tasks.md so [P] tasks of one group never change the same files"
    - name: speckit.gha.archive
      file: commands/speckit.gha.archive.md
      description: "Archive an implemented spec to specs/archive/<folder> and rewrite every reference to it, for a local or manual merge"
    - name: speckit.gha.architecture
      file: commands/speckit.gha.architecture.md
      description: "Write the Architecture Updates section of plan.md: the narratives, design updates, and status statements the feature changes in docs/architecture"
    - name: speckit.gha.drift
      file: commands/speckit.gha.drift.md
      description: "Check docs/architecture against the implemented spec and report stale, missing, or contradicting statements as convergence findings"

hooks:
  after_plan:
    command: speckit.gha.architecture
    optional: false
    description: "Write the Architecture Updates section of the generated plan.md"
  before_converge:
    command: speckit.gha.drift
    optional: false
    description: "Report architecture drift for convergence to turn into tasks"
  before_implement:
    command: speckit.gha.route
    optional: false
    description: "Choose local implementation or request implementation on GitHub"
  after_tasks:
    command: speckit.gha.refine
    optional: false
    description: "Refine the parallel task groups of the generated tasks.md"
  after_converge:
    command: speckit.gha.archive
    optional: true
    description: "Archive the converged spec before merging it locally (implementations on GitHub archive in their merge)"

tags:
  - "github-actions"
  - "implementation"
